        - { name: sel_start, type: int32_t, default: -1, attrs: { transient: true } }
        - { name: sel_end, type: int32_t, default: -1, attrs: { transient: true } }
        - { name: scroll_offset, type: math.Vec2, attrs: { transient: true } }
        - { name: focused, type: bool, default: false, attrs: { transient: true } }
        - { name: ime_composing, type: bool, default: false, attrs: { transient: true } }

- namespace: physics
  version: 1
  class_list:
    - enum: BodyType
      values:
        - { name: Static, value: 0 }
        - { name: Kinematic, value: 1 }
        - { name: Dynamic, value: 2 }
    - enum: ShapeType
      values:
        - { name: Box, value: 0 }
        - { name: Circle, value: 1 }
        - { name: Capsule, value: 2 }
        - { name: Cylinder, value: 3 }
        - { name: Convex, value: 4 }
        - { name: TriMesh, value: 5 }
        - { name: HeightField, value: 6 }
    - enum: JointType
      values:
        - { name: Fixed, value: 0 }
        - { name: Revolute, value: 1 }
        - { name: Prismatic, value: 2 }
        - { name: Ball, value: 3 }
        - { name: Rope, value: 4 }
        - { name: Spring, value: 5 }
        - { name: Generic, value: 6 }
    - enum: CombineRule
      values:
