        - { name: Bottom, value: 3 }
    - enum: GraphicsOp
      values:
        - { name: Line, value: 0 }
        - { name: Polyline, value: 1 }
        - { name: Polygon, value: 2 }
        - { name: Rect, value: 3 }
        - { name: Circle, value: 4 }
        - { name: Ellipse, value: 5 }
        - { name: Arc, value: 6 }
        - { name: QuadraticBezier, value: 7 }
        - { name: CubicBezier, value: 8 }
        - { name: ConvexPoly, value: 9 }
    - enum: GraphicsFlags
      underlying: uint32_t
      values:
        - { name: Fill, value: 1 }
        - { name: Stroke, value: 2 }
        - { name: Closed, value: 4 }
    - enum: LineJoin
      values:
        - { name: Miter, value: 0 }
        - { name: Bevel, value: 1 }
        - { name: Round, value: 2 }
    - enum: LineCap
      values:
        - { name: None, value: 0 }
        - { name: Butt, value: 1 }
        - { name: Round, value: 2 }
        - { name: Square, value: 3 }
    - enum: FillRule
      values:
        - { name: NonZero, value: 0 }
