        - { name: Color, value: 1 }
        - { name: Bold, value: 2 }
        - { name: Italic, value: 3 }
        - { name: Underline, value: 4 }
        - { name: Strikethrough, value: 5 }
        - { name: Font, value: 6 }
        - { name: Size, value: 7 }
        - { name: Outline, value: 8 }
        - { name: Image, value: 9 }
        - { name: Link, value: 10 }
    - enum: ImageAlign
