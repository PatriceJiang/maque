        - { name: Polyline, value: 1 }
        - { name: Polygon, value: 2 }
        - { name: Rect, value: 3 }
        - { name: Circle, value: 4 }
        - { name: Ellipse, value: 5 }
        - { name: Arc, value: 6 }
        - { name: QuadraticBezier, value: 7 }
        - { name: CubicBezier, value: 8 }
        - { name: ConvexPoly, value: 9 }
    - enum: GraphicsFlags
      underlying: uint32_t
      values:
        - { name: Fill, value: 1 }
        - { name: Stroke, value: 2 }
        - { name: Closed, value: 4 }
    - enum: LineJoin
      values:
        - { name: Miter, value: 0 }
        - { name: Bevel, value: 1 }
        - { name: Round, value: 2 }
    - enum: LineCap
      values:
        - { name: None, value: 0 }
        - { name: Butt, value: 1 }
        - { name: Round, value: 2 }
        - { name: Square, value: 3 }
    - enum: FillRule
      values:
        - { name: NonZero, value: 0 }
        - { name: EvenOdd, value: 1 }
    - enum: StreakMode
      values:
        - { name: Ribbon, value: 0 }
        - { name: Line, value: 1 }
        - { name: Points, value: 2 }
    - enum: StreakFade
      values:
        - { name: None, value: 0 }
        - { name: Head, value: 1 }
        - { name: Tail, value: 2 }
        - { name: Both, value: 3 }
    - enum: BillboardFacing
      values:
        - { name: FullScreen, value: 0 }
        - { name: YAxisLocked, value: 1 }
        - { name: ViewPlane, value: 2 }
        - { name: LookAtCamera, value: 3 }
    - enum: BillboardPivot
      values:
        - { name: Center, value: 0 }
        - { name: Bottom, value: 1 }
    - enum: ProbeSource
      values:
        - { name: Baked, value: 0 }
        - { name: Realtime, value: 1 }
    - enum: ProbeUpdateMode
      values:
        - { name: OnLoad, value: 0 }
        - { name: EveryFrame, value: 1 }
        - { name: Interval, value: 2 }
    - enum: ProbeShape
      values:
        - { name: Sphere, value: 0 }
        - { name: Box, value: 1 }
    - enum: EnvironmentSource
      values:
        - { name: None, value: 0 }
        - { name: Color, value: 1 }
        - { name: Gradient, value: 2 }
        - { name: Texture, value: 3 }
    - enum: SkyboxMode
