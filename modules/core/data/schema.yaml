    - enum: WrapMode
      values:
        - { name: None, value: 0 }
        - { name: Word, value: 1 }
        - { name: Char, value: 2 }
    - enum: TextAlign
      values:
        - { name: Left, value: 0 }
        - { name: Center, value: 1 }
        - { name: Right, value: 2 }
        - { name: Justify, value: 3 }
    - struct: Control
      roles: [ ui_control ]
      fields:
        - { name: anchor_preset, type: Anchor, default: "Anchor::TopLeft" }
        - { name: anchor_min, type: math.Vec2, attrs: { range: [0, 1] } }
        - { name: anchor_max, type: math.Vec2, attrs: { range: [0, 1] } }
        - { name: offset_min, type: math.Vec2, attrs: { unit: px } }
        - { name: offset_max, type: math.Vec2, default: "{100.0F, 30.0F}", attrs: { unit: px } }
        - { name: pivot, type: math.Vec2, attrs: { range: [0, 1] } }
        - { name: min_size, type: math.Vec2, attrs: { unit: px } }
        - { name: max_size, type: math.Vec2, attrs: { unit: px } }
        - { name: size_flags_h, type: SizeFlag, default: "SizeFlag::ShrinkBegin" }
        - { name: size_flags_v, type: SizeFlag, default: "SizeFlag::ShrinkBegin" }
        - { name: visible, type: bool, default: true }
        - { name: mouse_filter, type: MouseFilter, default: "MouseFilter::Stop" }
        - { name: z_index, type: int32_t, default: 0 }
        - { name: rect, type: math.Vec4, attrs: { transient: true } }
        - { name: scale, type: math.Vec2, default: "{1.0F, 1.0F}" }
        - { name: rotation, type: float, default: 0.0F, attrs: { unit: rad } }
    - struct: Container
      roles: [ ui_layout ]
      fields:
        - { name: mode, type: ContainerMode, default: "ContainerMode::Free" }
        - { name: padding, type: math.Vec4, attrs: { unit: px } }
        - { name: spacing, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: align_main, type: Align, default: "Align::Begin" }
        - { name: align_cross, type: Align, default: "Align::Begin" }
        - { name: columns, type: int32_t, default: 1, attrs: { range: [1, 128] } }
        - { name: grid_cell, type: math.Vec2, attrs: { unit: px } }
        - { name: fit_content, type: bool, default: false }
    # 画布（UI 根 + 分辨率策略）：把"设计分辨率"适配到任意窗口/显示器（docs/17）
    - enum: FitMode
      doc: "适配策略：设计分辨率 → 绘制区（设备像素）"
      values:
        - { name: None,      value: 0, doc: "1:1（1 设计像素 = 1 设备像素，不做缩放）" }
        - { name: FitWidth,  value: 1, doc: "按宽度等比适配（高度可能溢出/留边）" }
        - { name: FitHeight, value: 2, doc: "按高度等比适配" }
        - { name: ShowAll,   value: 3, doc: "等比缩放完整显示 + 留边（letterbox，默认）" }
        - { name: NoBorder,  value: 4, doc: "等比缩放铺满 + 裁剪（crop）" }
        - { name: Exact,     value: 5, doc: "非等比拉伸铺满（可能变形）" }
    - struct: Canvas
      roles: [ ui_canvas ]
      doc: "UI 根与分辨率策略：解析后的度量每帧写回 transient 字段（脚本/控制面可读）"
      fields:
        - { name: design_width,  type: float, default: 0.0F, attrs: { unit: px } }
        - { name: design_height, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: fit_mode,      type: FitMode, default: "FitMode::ShowAll" }
        - { name: align,         type: Align, default: "Align::Center", doc: "留边/裁剪时画布在窗口中的对齐" }
        - { name: dpi_scale,     type: bool, default: true, doc: "是否让绘制区跟随显示器内容缩放（HiDPI）" }
        # 渲染分辨率倍率（超采样）：0 = 自动（跟随窗口像素，上限 4）；1 = 设计分辨率（像素风，放大有锯齿）；
        # N = 固定 N 倍。文字按**渲染目标像素**栅格化 → 目标越接近窗口分辨率，文字越平滑
        - { name: render_scale,  type: float, default: 0.0F, attrs: { range: [0, 8] }, doc: "渲染分辨率倍率（0=自动跟随窗口像素）" }
        - { name: min_scale,     type: float, default: 0.0F, attrs: { unit: px, doc: "缩放下限（0=不限）" } }
        - { name: max_scale,     type: float, default: 0.0F, attrs: { unit: px, doc: "缩放上限（0=不限）" } }
        # ---- 解析结果（transient：每帧由引擎写回）----
        - { name: scale,        type: float, default: 1.0F, attrs: { transient: true } }
        - { name: scale_x,      type: float, default: 1.0F, attrs: { transient: true } }
        - { name: scale_y,      type: float, default: 1.0F, attrs: { transient: true } }
        - { name: offset_x,     type: float, default: 0.0F, attrs: { transient: true } }
        - { name: offset_y,     type: float, default: 0.0F, attrs: { transient: true } }
        - { name: viewport_w,   type: float, default: 0.0F, attrs: { transient: true } }
        - { name: viewport_h,   type: float, default: 0.0F, attrs: { transient: true } }
        - { name: window_w,     type: float, default: 0.0F, attrs: { transient: true, doc: "绘制区（设备像素）" } }
        - { name: window_h,     type: float, default: 0.0F, attrs: { transient: true } }
        - { name: device_scale, type: float, default: 1.0F, attrs: { transient: true, doc: "显示器内容缩放（HiDPI）" } }
        - { name: safe_left,    type: float, default: 0.0F, attrs: { transient: true, doc: "安全区内缩（刘海/圆角，设备像素）" } }
        - { name: safe_top,     type: float, default: 0.0F, attrs: { transient: true } }
        - { name: safe_right,   type: float, default: 0.0F, attrs: { transient: true } }
        - { name: safe_bottom,  type: float, default: 0.0F, attrs: { transient: true } }

    - struct: TextLabel
      roles: [ ui_text ]
      fields:
        - { name: text, type: string }
        - { name: font, type: "asset_ref<Font>", attrs: { ref: Font } }
        - { name: font_size, type: float, default: 16.0F, attrs: { unit: px, range: [1, 512] } }
        - { name: color, type: math.Vec4, default: "{1.0F, 1.0F, 1.0F, 1.0F}" }
        - { name: align_h, type: Align, default: "Align::Begin" }
        - { name: align_v, type: Align, default: "Align::Begin" }
        - { name: wrap_mode, type: TextWrap, default: "TextWrap::None" }
        - { name: line_spacing, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: outline_size, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: outline_color, type: math.Vec4, default: "{0.0F, 0.0F, 0.0F, 1.0F}" }
        - { name: uppercase, type: bool, default: false }
        - { name: text_size, type: math.Vec2, attrs: { transient: true } }
    - struct: Image
      fields:
        - { name: texture, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: region, type: math.Vec4 }
        - { name: modulate, type: math.Vec4, default: "{1.0F, 1.0F, 1.0F, 1.0F}" }
        - { name: stretch_mode, type: StretchMode, default: "StretchMode::Scale" }
        - { name: flip_h, type: bool, default: false }
        - { name: flip_v, type: bool, default: false }
        - { name: tile_scale, type: math.Vec2, default: "{1.0F, 1.0F}" }
        - { name: nine_patch_margin, type: math.Vec4, attrs: { unit: px } }
        - { name: texture_size, type: math.Vec2, attrs: { transient: true } }
    - struct: Button
      fields:
        - { name: text, type: string }
        - { name: icon, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: font, type: "asset_ref<Font>", attrs: { ref: Font } }
        - { name: font_size, type: float, default: 16.0F, attrs: { unit: px } }
        - { name: icon_align, type: Align, default: "Align::Begin" }
        - { name: text_color, type: math.Vec4 }
        - { name: style_normal, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: style_hover, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: style_pressed, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: style_disabled, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: bg_color, type: math.Vec4, default: "{0.3F, 0.3F, 0.3F, 1.0F}" }
        - { name: toggle_mode, type: bool, default: false }
        - { name: button_pressed, type: bool, default: false }
        - { name: disabled, type: bool, default: false }
        - { name: action, type: string }
        - { name: state, type: ButtonState, default: "ButtonState::Normal", attrs: { transient: true } }
    - struct: CheckBox
      roles: [ ui_check ]
      fields:
        - { name: checked, type: bool, default: false }
        - { name: tristate, type: bool, default: false }
        - { name: indeterminate, type: bool, default: false }
        - { name: disabled, type: bool, default: false }
        - { name: text, type: string }
        - { name: font, type: "asset_ref<Font>", attrs: { ref: Font } }
        - { name: font_size, type: float, default: 16.0F, attrs: { unit: px, range: [1, 512] } }
        - { name: text_color, type: math.Vec4 }
        - { name: icon_checked, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: icon_unchecked, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: icon_indeterminate, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: box_position, type: Align, default: "Align::Begin" }
        - { name: state, type: CheckState, default: "CheckState::Unchecked", attrs: { transient: true } }
    - struct: RadioGroup
      fields:
        - { name: selected_index, type: int32_t, default: -1, attrs: { range: [-1, 65535] } }
        - { name: allow_unselect, type: bool, default: false }
        - { name: loop, type: bool, default: true }
        - { name: orientation, type: Orientation, default: "Orientation::Vertical" }
        - { name: disabled, type: bool, default: false }
        - { name: selected, type: entity_ref, attrs: { ref: Control, transient: true } }
        - { name: member_count, type: int32_t, default: 0, attrs: { transient: true, readonly: true } }
    - struct: Tabs
      fields:
        - { name: current_tab, type: int32_t, default: 0, attrs: { range: [0, 65535] } }
        - { name: tab_bar, type: entity_ref, attrs: { ref: Control } }
        - { name: side, type: Side, default: "Side::Top" }
        - { name: transition, type: TabTransition, default: "TabTransition::None" }
        - { name: transition_time, type: float, default: 0.15F, attrs: { unit: s, range: [0, 10] } }
        - { name: tab_count, type: int32_t, default: 0, attrs: { transient: true, readonly: true } }
