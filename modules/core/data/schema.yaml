- namespace: anim
  version: 1
  class_list:
    - enum: LoopMode
      values:
        - { name: Once, value: 0 }
        - { name: Loop, value: 1 }
        - { name: PingPong, value: 2 }
        - { name: ClampForever, value: 3 }
