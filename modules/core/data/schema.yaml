        - { name: Bold, value: 2 }
        - { name: Italic, value: 3 }
        - { name: Underline, value: 4 }
        - { name: Strikethrough, value: 5 }
        - { name: Font, value: 6 }
        - { name: Size, value: 7 }
        - { name: Outline, value: 8 }
