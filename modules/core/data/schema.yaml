        - { name: Directional, value: 0 }
        - { name: Point, value: 1 }
        - { name: Spot, value: 2 }
    - enum: ShadowMode
      values:
        - { name: Off, value: 0 }
        - { name: Hard, value: 1 }
        - { name: Soft, value: 2 }
    - enum: LayerKind
      values:
        - { name: Canvas2D, value: 0 }
        - { name: World3D, value: 1 }
        - { name: UI, value: 2 }
    - enum: BlendMode
      values:
        - { name: Alpha, value: 0 }
        - { name: Additive, value: 1 }
        - { name: Multiply, value: 2 }
    - enum: RichTagType
      values:
