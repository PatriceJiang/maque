        - { name: scroll_h, type: float, default: 0.0F, attrs: { range: [0, 1] } }
        - { name: scroll_v, type: float, default: 0.0F, attrs: { range: [0, 1] } }
        - { name: scroll_mode_h, type: ScrollMode, default: "ScrollMode::Auto" }
        - { name: scroll_mode_v, type: ScrollMode, default: "ScrollMode::Auto" }
        - { name: scroll_step, type: math.Vec2, default: "{16.0F, 16.0F}", attrs: { unit: px } }
        - { name: follow_focus, type: bool, default: false }
        - { name: deadzone, type: int32_t, default: 0, attrs: { unit: px } }
        - { name: smooth, type: bool, default: false }
        - { name: bar_thickness, type: float, default: 8.0F, attrs: { unit: px } }
        - { name: scroll_offset, type: math.Vec2, attrs: { unit: px, transient: true } }
