    - enum: AlignContent
      values:
        - { name: Stretch, value: 0 }
        - { name: Start, value: 1 }
        - { name: End, value: 2 }
        - { name: Center, value: 3 }
        - { name: SpaceBetween, value: 4 }
        - { name: SpaceAround, value: 5 }
    - enum: FlexBasisMode
      values:
        - { name: Auto, value: 0 }
