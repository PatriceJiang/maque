      - { fn: mq_vfs_add_mem,       returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: name, type: "const char*" }, { name: data, type: "const void*" }, { name: size, type: "size_t" } ] }
      - { fn: mq_vfs_mount_zip,     returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: mountpoint, type: "const char*" }, { name: zip_path, type: "const char*" } ] }
      - { fn: mq_vfs_exists,        returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: path, type: "const char*" } ] }
      - { fn: mq_vfs_register_builtin, returns: void,   args: [ { name: vfs, type: "mq_vfs*" }, { name: logical, type: "const char*" }, { name: data, type: "const void*" }, { name: size, type: "size_t" } ] }
      - { fn: mq_vfs_read,          returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: path, type: "const char*" }, { name: out, type: "void**" }, { name: out_size, type: "size_t*" } ] }
      - { fn: mq_vfs_free,          returns: void,      args: [ { name: p, type: "void*" } ] }
      - { fn: mq_vfs_hash,          returns: uint64_t,  args: [ { name: data, type: "const void*" }, { name: size, type: "size_t" } ] }
      - { fn: mq_vfs_hash_path,     returns: uint64_t,  args: [ { name: vfs, type: "mq_vfs*" }, { name: path, type: "const char*" } ] }
      - { fn: mq_vfs_read_verified, returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: path, type: "const char*" }, { name: expect, type: "uint64_t" }, { name: out, type: "void**" }, { name: out_size, type: "size_t*" } ] }
      - { fn: mq_vfs_resolve,       returns: int,       args: [ { name: vfs, type: "mq_vfs*" }, { name: path, type: "const char*" }, { name: out, type: "char*" }, { name: out_cap, type: "size_t" } ] }

