    - struct: Terrain
      fields:
        - { name: terrain_data, type: "asset_ref<TerrainData>", attrs: { ref: TerrainData } }
        - { name: layer_material, type: "asset_ref<Material>", attrs: { ref: Material } }
        - { name: tile_size, type: float, default: 16.0F, attrs: { unit: m } }
        - { name: lod_mode, type: TerrainLodMode, default: "TerrainLodMode::Auto" }
        - { name: lod_levels, type: "TerrainLevel[]" }
        - { name: fixed_lod, type: uint8_t, default: 0 }
        - { name: lod_bias, type: float, default: 0.0F }
        - { name: height_scale, type: float, default: 1.0F }
        - { name: cast_shadow, type: bool, default: true }
        - { name: receive_shadow, type: bool, default: true }
        - { name: visible, type: bool, default: true }
        - { name: culling_mask, type: uint32_t, default: 4294967295, attrs: { bitmask: true } }
        - { name: layer, type: entity_ref, attrs: { ref: RenderLayer, weak: true } }
        - { name: lod_chunks, type: "uint16_t[]", attrs: { transient: true } }

- namespace: ui
  version: 1
