      - { fn: mq_host_push_pointer, returns: "void", args: [ { name: s, type: "mq_host_scene*" }, { name: type, type: "int" }, { name: button, type: "int" }, { name: x, type: "float" }, { name: y, type: "float" } ] }
      - { fn: mq_host_push_key, returns: "void", args: [ { name: s, type: "mq_host_scene*" }, { name: key, type: "int" }, { name: down, type: "int" }, { name: text, type: "const char*" } ] }
      - { fn: mq_host_frame, returns: "uint64_t", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_checksum, returns: "uint64_t", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_should_quit, returns: "int", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_control, returns: "const char*", args: [ { name: s, type: "mq_host_scene*" }, { name: request, type: "const char*" } ] }

- namespace: runtime
  version: 1
  module_abi:
    module: runtime
    abi_name: "maque.runtime"
    fns:
      - { fn: mq_run_scene, returns: "int", args: [ { name: scn_path, type: "const char*" } ] }
      - { fn: mq_run_scene_ex, returns: "int", args: [ { name: scn_path, type: "const char*" }, { name: frames_dir, type: "const char*" } ] }

# 文本渲染（Label/RichText）：FreeType 栅格化 → 图集 → 字形 quad；布局与富文本解析为纯函数。
- namespace: text
  version: 1
  module_abi:
    module: text
    abi_name: "maque.text"
    summary: "字体加载/图集/文本布局/富文本标记解析（确定性纯函数，docs/13/17）"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    opaque: [ mq_font ]
    enums:
      - doc: "错误码（0 = OK）。"
        values:
          - { name: MQ_TEXT_OK,        value: 0 }
          - { name: MQ_TEXT_ERR_ARG,   value: 1 }
          - { name: MQ_TEXT_ERR_FONT,  value: 2, doc: "字体加载/栅格化失败" }
          - { name: MQ_TEXT_ERR_CAP,   value: 3, doc: "输出缓冲不足（out_needed 报告所需）" }
      - doc: "水平对齐（与 ui.Align 一致：Begin/Center/End）。"
        values:
          - { name: MQ_TEXT_ALIGN_BEGIN,  value: 0 }
          - { name: MQ_TEXT_ALIGN_CENTER, value: 1 }
          - { name: MQ_TEXT_ALIGN_END,    value: 2 }
      - doc: "换行模式（与 ui.TextWrap 一致）。"
        values:
          - { name: MQ_TEXT_WRAP_NONE, value: 0, doc: "不换行（\\n 仍生效）" }
          - { name: MQ_TEXT_WRAP_WORD, value: 1, doc: "按词换行（超长词按字符断）" }
          - { name: MQ_TEXT_WRAP_CHAR, value: 2, doc: "按字符换行" }
    structs:
      - name: mq_text_style
        doc: "排版参数（struct_size 版本化）。"
        fields:
          - { name: struct_size, type: "uint32_t" }
          - { name: font_size, type: "float", doc: "逻辑像素字号；<=0 → 16" }
          - { name: device_scale, type: "float", doc: "设备像素缩放（HiDPI/窗口缩放）：栅格化字号 = round(font_size × device_scale)；<=0 → 1" }
          - { name: pixel_snap, type: "int32_t", doc: "1 = 字形位置对齐到整数设备像素（pixel-perfect，默认）" }
          - { name: hinting, type: "int32_t", doc: "0 = 默认 hinting（整数笔画、清晰），1 = 关闭 hinting（几何精确）" }
          - { name: line_spacing, type: "float" }
          - { name: wrap, type: "uint32_t", doc: "MQ_TEXT_WRAP_*" }
          - { name: align, type: "uint32_t", doc: "MQ_TEXT_ALIGN_*" }
          - { name: max_width, type: "float", doc: "<=0 → 不限制" }
          - { name: r, type: "float", doc: "默认前景色（可被富文本覆盖）" }
          - { name: g, type: "float" }
          - { name: b, type: "float" }
          - { name: a, type: "float" }
      - name: mq_text_glyph
        doc: "排版输出的单个字形（位置为相对文本框左上角、y 向下）。"
        fields:
          - { name: codepoint, type: "uint32_t" }
          - { name: x, type: "float" }
          - { name: y, type: "float" }
          - { name: w, type: "float", doc: "字形位图宽（像素）" }
          - { name: h, type: "float" }
          - { name: ax, type: "int32_t", doc: "图集内像素原点 x（渲染侧应按**最终图集尺寸**换算 UV）" }
          - { name: ay, type: "int32_t", doc: "图集内像素原点 y" }
          - { name: u0, type: "float", doc: "图集 UV（按排版时图集尺寸归一化；图集增长后可能过期，建议用 ax/ay）" }
          - { name: v0, type: "float" }
          - { name: u1, type: "float" }
          - { name: v1, type: "float" }
          - { name: r, type: "float", doc: "该字形颜色（富文本 run 覆盖）" }
          - { name: g, type: "float" }
          - { name: b, type: "float" }
          - { name: a, type: "float" }
          - { name: size, type: "float", doc: "该字形逻辑字号" }
          - { name: device_size, type: "float", doc: "实际栅格化字号（设备像素，整数）" }
          - { name: x0, type: "float", doc: "位图左上角 x（相对文本框原点，设备像素，已像素对齐）" }
          - { name: y0, type: "float", doc: "位图左上角 y（相对文本框原点，设备像素，已像素对齐；y 向下）" }
          - { name: bearing_x, type: "int32_t", doc: "FreeType bitmap_left（设备像素）" }
          - { name: bearing_y, type: "int32_t", doc: "FreeType bitmap_top（相对基线，设备像素）" }
      - name: mq_text_metrics
        doc: "排版结果度量。"
        fields:
          - { name: width, type: "float" }
          - { name: height, type: "float" }
          - { name: line_count, type: "uint32_t" }
          - { name: glyph_count, type: "uint32_t" }
          - { name: baseline, type: "float", doc: "首行基线相对顶部距离（设备像素）" }
          - { name: ascent, type: "float", doc: "字体 ascent（设备像素）" }
          - { name: device_scale, type: "float", doc: "本次排版使用的设备缩放" }
    fns:
      - { fn: mq_font_load_file, returns: "mq_font*", args: [ { name: path, type: "const char*" } ],
          doc: "加载 TTF/OTF；失败返回 NULL（调用方回退到内置位图字体）" }
      - { fn: mq_font_destroy, returns: void, args: [ { name: font, type: "mq_font*" } ] }
      - { fn: mq_font_builtin, returns: "mq_font*", args: [], doc: "内置位图字体（无外部依赖，保证 headless/CI 可用）" }
      - { fn: mq_font_height, returns: float, args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" } ] }
      - { fn: mq_font_advance, returns: float, args: [ { name: font, type: "mq_font*" }, { name: codepoint, type: "uint32_t" }, { name: size, type: "float" } ] }
      - { fn: mq_text_measure, returns: int, args: [ { name: font, type: "mq_font*" }, { name: style, type: "const mq_text_style*" }, { name: text, type: "const char*" }, { name: out_metrics, type: "mq_text_metrics*" } ],
          doc: "只测量（不产生字形）" }
      - { fn: mq_text_layout, returns: int, args: [ { name: font, type: "mq_font*" }, { name: style, type: "const mq_text_style*" }, { name: text, type: "const char*" }, { name: out, type: "mq_text_glyph*" }, { name: cap, type: "uint32_t" }, { name: out_count, type: "uint32_t*" }, { name: out_metrics, type: "mq_text_metrics*" } ],
          doc: "排版为字形序列（支持 <color>/<size>/<b>/<br/> 富文本标记）" }
      - { fn: mq_text_strip_markup, returns: int, args: [ { name: text, type: "const char*" }, { name: out, type: "char*" }, { name: cap, type: "uint32_t" } ],
          doc: "去掉富文本标记后的纯文本（供自省/日志）" }
      - { fn: mq_font_atlas, returns: int, args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" }, { name: out_rgba, type: "uint8_t*" }, { name: cap, type: "size_t" }, { name: out_w, type: "uint32_t*" }, { name: out_h, type: "uint32_t*" } ],
          doc: "取指定字号的字形图集（RGBA8；**按需增长**：排版过的码点才会进入图集）" }
      - { fn: mq_font_atlas_generation, returns: "uint32_t", args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" } ],
          doc: "图集版本号：每新增字形 +1（宿主据此决定是否重传纹理）" }
      - { fn: mq_font_glyph_count, returns: "uint32_t", args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" } ],
          doc: "该字号已栅格化的字形数（自省/测试）" }
      - { fn: mq_font_glyph_at, returns: int, args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" }, { name: index, type: "uint32_t" }, { name: out, type: "mq_text_glyph*" } ],
          doc: "按索引取已栅格化字形（码点 + 图集矩形；inspector 图集面板用）" }
      - { fn: mq_font_atlas_size, returns: int, args: [ { name: font, type: "mq_font*" }, { name: size, type: "float" }, { name: out_w, type: "uint32_t*" }, { name: out_h, type: "uint32_t*" } ],
          doc: "图集当前尺寸（不复制像素；增长中）" }

# 输入模拟器（开发/CI，docs/19）：帧索引场景文件 → 输入事件流；与录制/回放/确定性一致。
- namespace: sim
  version: 1
  module_abi:
    module: sim
    abi_name: "maque.sim"
    summary: "输入模拟器：把 .sim.json 场景回放为确定性输入事件流（开发/自动化/演示）"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    opaque: [ mq_sim ]
    enums:
      - doc: "模拟事件类型（与输入事件语义一致）"
        values:
          - { name: MQ_SIM_POINTER_MOVE,  value: 0 }
          - { name: MQ_SIM_POINTER_DOWN,  value: 1 }
          - { name: MQ_SIM_POINTER_UP,    value: 2 }
          - { name: MQ_SIM_POINTER_WHEEL, value: 3 }
          - { name: MQ_SIM_KEY_DOWN,      value: 4 }
          - { name: MQ_SIM_KEY_UP,        value: 5 }
          - { name: MQ_SIM_TEXT,          value: 6 }
      - doc: "坐标空间"
        values:
          - { name: MQ_SIM_SPACE_WINDOW, value: 0, doc: "窗口像素（宿主负责映射为世界坐标）" }
          - { name: MQ_SIM_SPACE_WORLD,  value: 1, doc: "世界坐标（直接使用）" }
    structs:
      - name: mq_sim_event
        doc: "单个模拟事件（text 指向模拟器内部存储，生命周期到下次 load/reset/destroy）"
        fields:
          - { name: frame, type: "uint64_t" }
          - { name: kind, type: "uint32_t" }
          - { name: space, type: "uint32_t" }
          - { name: x, type: "float" }
          - { name: y, type: "float" }
          - { name: dx, type: "float" }
          - { name: dy, type: "float" }
          - { name: button, type: "uint32_t" }
          - { name: key, type: "uint32_t" }
          - { name: text, type: "const char*" }
    fns:
      - { fn: mq_sim_create,   returns: "mq_sim*", args: [] }
      - { fn: mq_sim_destroy,  returns: void, args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_load_json, returns: int,
          args: [ { name: sim, type: "mq_sim*" }, { name: json, type: "const char*" }, { name: len, type: "size_t" },
                  { name: err, type: "char*" }, { name: err_cap, type: "size_t" } ],
          doc: "载入场景 JSON（失败非 0 并写 err）；成功后游标归零" }
      - { fn: mq_sim_count,    returns: "uint32_t", args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_event_at, returns: int, args: [ { name: sim, type: "mq_sim*" }, { name: index, type: "uint32_t" }, { name: out, type: "mq_sim_event*" } ] }
      - { fn: mq_sim_due,      returns: int,
          args: [ { name: sim, type: "mq_sim*" }, { name: frame, type: "uint64_t" }, { name: out, type: "mq_sim_event*" },
                  { name: cap, type: "uint32_t" }, { name: out_count, type: "uint32_t*" } ],
          doc: "取出该帧到期的全部事件（声明顺序）；游标前进（loop 时回绕）" }
      - { fn: mq_sim_cursor,   returns: "uint32_t", args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_finished, returns: int, args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_reset,    returns: void, args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_set_loop, returns: void, args: [ { name: sim, type: "mq_sim*" }, { name: loop, type: "int" } ] }
      - { fn: mq_sim_loop,     returns: int, args: [ { name: sim, type: "mq_sim*" } ], doc: "是否循环回放" }
      - { fn: mq_sim_loaded,   returns: int, args: [ { name: sim, type: "mq_sim*" } ] }
      - { fn: mq_sim_last_frame, returns: "uint64_t", args: [ { name: sim, type: "mq_sim*" } ], doc: "最后事件帧号（场景时长参考）" }

# 分辨率策略（画布适配，docs/17）：纯函数、无依赖 —— UI 排版的"适配规则"单一真相。
- namespace: canvas
  version: 1
  module_abi:
    module: canvas
    abi_name: "maque.canvas"
    summary: "分辨率策略：设计分辨率 → 绘制区（设备像素）的缩放/偏移/安全区解析（纯函数）"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    enums:
      - doc: "适配策略（与 ui.FitMode 对齐）"
        values:
          - { name: MQ_CANVAS_FIT_NONE,      value: 0 }
          - { name: MQ_CANVAS_FIT_WIDTH,     value: 1 }
          - { name: MQ_CANVAS_FIT_HEIGHT,    value: 2 }
          - { name: MQ_CANVAS_FIT_SHOW_ALL,  value: 3 }
          - { name: MQ_CANVAS_FIT_NO_BORDER, value: 4 }
          - { name: MQ_CANVAS_FIT_EXACT,     value: 5 }
      - doc: "对齐（与 ui.Align 对齐）"
        values:
          - { name: MQ_CANVAS_ALIGN_BEGIN,  value: 0 }
          - { name: MQ_CANVAS_ALIGN_CENTER, value: 1 }
          - { name: MQ_CANVAS_ALIGN_END,    value: 2 }
    structs:
      - name: mq_canvas_desc
        doc: "输入：设计分辨率 + 策略 + 绘制区（设备像素）"
        fields:
          - { name: struct_size, type: "uint32_t" }
          - { name: design_w, type: "float" }
          - { name: design_h, type: "float" }
          - { name: fit, type: "int32_t" }
          - { name: align, type: "int32_t" }
          - { name: min_scale, type: "float", doc: "<=0 → 不限" }
          - { name: max_scale, type: "float", doc: "<=0 → 不限" }
          - { name: window_w, type: "float", doc: "绘制区宽（设备像素）" }
          - { name: window_h, type: "float" }
          - { name: dpi_scale, type: "float", doc: "显示器内容缩放（HiDPI）；窗口/安全区已按此换算时传 1" }
          - { name: safe_left, type: "float", doc: "安全区内缩（设备像素）" }
          - { name: safe_top, type: "float" }
          - { name: safe_right, type: "float" }
          - { name: safe_bottom, type: "float" }
      - name: mq_canvas_metrics
        doc: "输出：设计 → 设备像素的映射（含留边/裁剪/安全区）"
        fields:
          - { name: scale, type: "float", doc: "等比缩放（Exact 时取 min 供文字等使用）" }
          - { name: scale_x, type: "float" }
          - { name: scale_y, type: "float" }
          - { name: offset_x, type: "float", doc: "画布原点在绘制区中的偏移（设备像素）" }
          - { name: offset_y, type: "float" }
          - { name: viewport_w, type: "float", doc: "画布可视矩形（设备像素）" }
          - { name: viewport_h, type: "float" }
          - { name: window_w, type: "float" }
          - { name: window_h, type: "float" }
          - { name: device_scale, type: "float", doc: "生效的显示器内容缩放" }
    fns:
      - { fn: mq_canvas_resolve, returns: int,
          args: [ { name: desc, type: "const mq_canvas_desc*" }, { name: out, type: "mq_canvas_metrics*" } ],
          doc: "解析分辨率策略（确定性纯函数；非法输入回退 1:1 并返回非 0）" }
      - { fn: mq_canvas_window_to_design, returns: int,
          args: [ { name: m, type: "const mq_canvas_metrics*" }, { name: wx, type: "float" }, { name: wy, type: "float" },
                  { name: out_dx, type: "float*" }, { name: out_dy, type: "float*" } ],
          doc: "窗口（设备像素）→ 设计坐标（输入映射用；含留边/裁剪）" }
      - { fn: mq_canvas_design_to_window, returns: int,
          args: [ { name: m, type: "const mq_canvas_metrics*" }, { name: dx, type: "float" }, { name: dy, type: "float" },
                  { name: out_wx, type: "float*" }, { name: out_wy, type: "float*" } ],
          doc: "设计坐标 → 窗口（设备像素）" }
