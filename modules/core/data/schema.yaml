      - { fn: mq_input_set_focus, returns: "void", args: [ { name: in, type: "mq_input*" }, { name: entity, type: "int" } ] }
      - { fn: mq_input_set_capture, returns: "void", args: [ { name: in, type: "mq_input*" }, { name: pointer_id, type: "uint32_t" }, { name: entity, type: "int" } ] }
      - { fn: mq_input_get_capture, returns: "int", args: [ { name: in, type: "mq_input*" }, { name: pointer_id, type: "uint32_t" } ] }
      - { fn: mq_input_release_capture, returns: "void", args: [ { name: in, type: "mq_input*" }, { name: pointer_id, type: "uint32_t" } ] }
      - { fn: mq_input_frame_index, returns: "int", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_record_begin, returns: "void", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_record_end, returns: "void", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_recording, returns: "int", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_replay_begin, returns: "int", args: [ { name: in, type: "mq_input*" }, { name: log, type: "const void*" }, { name: size, type: "size_t" } ] }
      - { fn: mq_input_replay_end, returns: "void", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_replaying, returns: "int", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_inject, returns: "void", args: [ { name: in, type: "mq_input*" }, { name: ev, type: "const mq_input_event*" } ] }
      - { fn: mq_input_last_consumed, returns: "int", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_log_bytes, returns: "const void*", args: [ { name: in, type: "mq_input*" }, { name: out_size, type: "size_t*" } ] }
      - { fn: mq_input_log_json, returns: "const char*", args: [ { name: in, type: "mq_input*" } ] }
      - { fn: mq_input_log_load_json, returns: "int", args: [ { name: in, type: "mq_input*" }, { name: json, type: "const char*" } ] }
      - { fn: mq_input_log_set_meta, returns: "void", args: [ { name: in, type: "mq_input*" }, { name: key, type: "const char*" }, { name: value, type: "const char*" } ] }
      - { fn: mq_input_log_get_meta, returns: "const char*", args: [ { name: in, type: "mq_input*" }, { name: key, type: "const char*" } ] }

- namespace: scn
  version: 1
  class_list:
    # 组件类型（docs/17）：entity 由带 type 的若干组件组合而成。
    # roles 声明组件语义角色（引擎据此通用处理，不硬编码类型）。
    - struct: Transform2D
      roles: [transform2d]
      fields:
        - { name: x, type: float, default: 0.0F }
        - { name: y, type: float, default: 0.0F }
    - struct: Sprite
      roles: [sprite]
      fields:
        - { name: radius,   type: float,  default: 8.0F }
        # width/height > 0 → 画**矩形**（瓦片/方块/非方形贴图）；否则按 radius 画圆
        - { name: width,    type: float,  default: 0.0F, attrs: { unit: px } }
        - { name: height,   type: float,  default: 0.0F, attrs: { unit: px } }
        - { name: r,        type: float,  default: 0.4F }
        - { name: g,        type: float,  default: 0.8F }
        - { name: b,        type: float,  default: 1.0F }
        - { name: texture,  type: string, default: "" }        # 贴图资源引用
        - { name: material, type: string, default: "" }        # 材质资源引用(builtin:/或assets)
    # 材质资源（轻量；docs/assets/01）：着色基色 + 贴图引用
    - struct: SpriteMaterial
      fields:
        - { name: base_color, type: math.Vec4, default: "{1.0F,1.0F,1.0F,1.0F}" }
        - { name: texture,    type: string,    default: "" }
    # UI 控件（docs/19 §4/§8、components/04/08）：命中测试/绘制只按 role，引擎不认具体类型。
    - struct: Button
      roles: [ui_button]
      fields:
        - { name: x,       type: float,   default: 0.0F }
        - { name: y,       type: float,   default: 0.0F }
        - { name: width,   type: float,   default: 96.0F }
        - { name: height,  type: float,   default: 28.0F }
        - { name: z,       type: int32_t, default: 0 }          # z-order（越大越靠上）
        - { name: label,   type: string,  default: "Button" }
        - { name: r,       type: float,   default: 0.22F }
        - { name: g,       type: float,   default: 0.26F }
        - { name: b,       type: float,   default: 0.36F }
        - { name: pressed, type: bool,    default: false }      # 由 input 分发写回（瞬态语义）
        - { name: hovered, type: bool,    default: false }
        - { name: enabled, type: bool,    default: true }
    - struct: Label
      roles: [ui_label]
      fields:
        - { name: x,    type: float,   default: 0.0F }
        - { name: y,    type: float,   default: 0.0F }
        - { name: z,    type: int32_t, default: 0 }
        - { name: text, type: string,  default: "" }
        - { name: r,    type: float,   default: 1.0F }
        - { name: g,    type: float,   default: 1.0F }
        - { name: b,    type: float,   default: 1.0F }
        - { name: a,    type: float,   default: 1.0F }
        # ---- 文本排版（与 ui.TextLabel 对齐；docs/17）----
        - { name: font_size, type: float, default: 16.0F, attrs: { unit: px, range: [1, 512] } }
        - { name: align, type: "ui.Align", default: "ui::Align::Begin" }
        - { name: wrap, type: "ui.TextWrap", default: "ui::TextWrap::None" }
        - { name: max_width, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: line_spacing, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: outline_size, type: float, default: 0.0F, attrs: { unit: px } }
        - { name: outline_r, type: float, default: 0.0F }
        - { name: outline_g, type: float, default: 0.0F }
        - { name: outline_b, type: float, default: 0.0F }
        - { name: font, type: string, default: "", attrs: { ref: Font } }
        - { name: text_w, type: float, default: 0.0F, attrs: { transient: true } }
        - { name: text_h, type: float, default: 0.0F, attrs: { transient: true } }
        - { name: line_count, type: int32_t, default: 0, attrs: { transient: true } }
    # 动画播放器（docs/15 §2）：关键帧采样，写回目标组件的反射字段。
    - struct: AnimationPlayer
      roles: [anim_player]
      fields:
        - { name: clip,     type: string,  default: "" }        # 动画片段资源（assets JSON）
        - { name: time,     type: float,   default: 0.0F }      # 播放头（秒，由引擎推进）
        - { name: speed,    type: float,   default: 1.0F }
        - { name: loop,     type: bool,    default: true }
        - { name: playing,  type: bool,    default: true }
        - { name: duration, type: float,   default: 0.0F }      # 采样后写回（只读语义）
    # CPU 粒子发射器（docs/15 §4）：确定性（引擎 RNG，参与回放），上限受池大小约束。
    - struct: ParticleEmitter
      roles: [particle_emitter]
      fields:
        - { name: rate,      type: float, default: 20.0F }     # 每秒发射数
        - { name: lifetime,  type: float, default: 1.0F }      # 秒
        - { name: speed,     type: float, default: 60.0F }     # 初速度（像素/秒）
        - { name: spread,    type: float, default: 0.5F }      # 方向随机幅度（0..1）
        - { name: gravity,   type: float, default: 120.0F }    # 自定义重力（与物理无关）
        - { name: size,      type: float, default: 3.0F }
        - { name: r,         type: float, default: 1.0F }
        - { name: g,         type: float, default: 0.6F }
        - { name: b,         type: float, default: 0.2F }
        - { name: max_count, type: uint32_t, default: 256 }    # 池上限（docs/07 §8 预算）
        - { name: enabled,   type: bool, default: true }
    # Prefab 实例（docs/12 §5、docs/assets）：指向 prefab 资源（.prefab.json），
    # 由引擎在加载时就地实例化为子节点；编辑期删除该组件即"断开链接"（bake）。
    - struct: PrefabInstance
      fields:
        - { name: source, type: string, default: "" }        # 相对场景目录的资源路径
        - { name: detached, type: bool, default: false }     # true = 已 bake（不再跟随源）
    # 导航代理（2D 网格切片；docs/15 持续项）：寻路由确定性 nav 模块完成。
    - struct: NavAgent
      roles: [nav_agent]
      fields:
        - { name: tx,          type: float,  default: 0.0F }     # 目标（世界坐标）
        - { name: ty,          type: float,  default: 0.0F }
        - { name: speed,       type: float,  default: 60.0F }    # 像素/秒
        - { name: arrive_dist, type: float,  default: 2.0F }
        - { name: repath,      type: bool,   default: true }     # 目标移动时重算
        - { name: has_target,  type: bool,   default: false }
        - { name: state,       type: int32_t, default: 0 }       # 0 空闲 1 移动 2 到达 3 无路
    # 相机（docs/13）：按 role 提取，引擎不认具体组件类型。
    - struct: Camera
      roles: [camera]
      fields:
        - { name: x,        type: float, default: 0.0F }        # 世界坐标（相机中心）
        - { name: y,        type: float, default: 0.0F }
        - { name: zoom,     type: float, default: 1.0F }        # 1 = 1:1 像素
        - { name: rotation, type: float, default: 0.0F }        # 弧度
        - { name: active,   type: bool,  default: true }
    - struct: Scene
      fields:
        - { name: title,    type: string,  default: "maque scene" }
        - { name: script,   type: string,  default: "" }      # 关联脚本资源（相对场景目录）
        # 多脚本（多语言）协作：按**声明顺序**创建 VM 并投递事件（确定性）。
        # 留空则用上面的 script；两者都给时 scripts 生效。
        - { name: scripts,  type: "string[]", doc: "多脚本列表（多语言，按声明顺序）" }
        - { name: width,    type: int32_t, default: 320 }
        - { name: height,   type: int32_t, default: 240 }
        - { name: seed,     type: uint32_t, default: 0 }
        - { name: views,    type: int32_t, default: 1 }         # 同屏视图数（VR: 2）
        - { name: eye_sep,  type: float,   default: 0.0F }      # 眼距/视差（像素）
        # 物理（docs/15 §3）：求解器由引擎侧确定性模块提供，场景只声明参数
        - { name: gravity_y,   type: float, default: 900.0F }   # 重力（像素/秒²，y 向下）
        - { name: restitution, type: float, default: 0.86F }    # 弹性（0..1）
        # entities 不在此：节点树通用（name/children/components），组件按 type 反射反序列化      # 引擎 RNG 种子（确定性）

# 宿主 API（引擎能力）：ctx:true → 生成 C 声明 + JS 绑定（docs/21）
- namespace: host
  version: 1
  global: true          # host.* 绑定到脚本全局（log(...)）
  api_list:
    - { fn: screen_w,      returns: float,  ctx: true }
    - { fn: screen_h,      returns: float,  ctx: true }
    - { fn: rng,           returns: float,  ctx: true }
    - { fn: quit,          returns: void,   ctx: true }
    - { fn: clear,         ctx: true, args: [ { name: r, type: float }, { name: g, type: float }, { name: b, type: float } ] }
    - { fn: log,           ctx: true, args: [ { name: msg,  type: string } ] }
    - { fn: cfg,           ctx: true, args: [ { name: path, type: string } ], returns: float }
    - { fn: load_texture,  ctx: true, args: [ { name: path, type: string } ], returns: float }
    - { fn: entity_spawn,  ctx: true, returns: float }
    - { fn: entity_set_pos,ctx: true, args: [ { name: id, type: float }, { name: x, type: float }, { name: y, type: float } ] }
    - { fn: entity_x,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_y,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_count,  ctx: true, returns: float }
    - { fn: entity_destroy,ctx: true, args: [ { name: id, type: float } ] }
    - { fn: entity_name,   ctx: true, args: [ { name: id, type: float } ], returns: string }
    - { fn: entity_find,   ctx: true, args: [ { name: name, type: string } ], returns: float }
    # 实体 id 单调分配（永不复用）→ 陈旧 id 可判定：valid=0 表示已销毁/从未存在
    - { fn: entity_valid,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 输入（docs/19）：脚本读"事件发生时"的状态，不读设备（确定性/回放友好）
    - { fn: input_x,       ctx: true, returns: float }
    - { fn: input_y,       ctx: true, returns: float }
    - { fn: input_target,  ctx: true, returns: float }     # 命中实体（-1 = 未命中）
    - { fn: input_down,    ctx: true, returns: float }     # 左键/指针是否按住
    - { fn: input_key,     ctx: true, args: [ { name: code, type: float } ], returns: float }
    - { fn: input_focus,   ctx: true, returns: float }
    - { fn: input_set_focus, ctx: true, args: [ { name: id, type: float } ] }
    # UI（docs/19 §4/§8、components/04）：命中/悬停查询（引擎按 role，不认具体组件）
    - { fn: ui_hit,        ctx: true, returns: float }     # 当前指针下最上层可交互控件
    - { fn: ui_hover,      ctx: true, returns: float }     # 上一帧悬停控件
    - { fn: ui_pressed,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_z,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_set_z,  ctx: true, args: [ { name: id, type: float }, { name: z, type: float } ] }
    # 游戏常用组合（保持脚本只表达玩法；物理语义在引擎侧，docs/15/19）
    - { fn: spawn_ball,    ctx: true, args: [ { name: x, type: float }, { name: y, type: float },
                                             { name: vx, type: float }, { name: vy, type: float },
                                             { name: radius, type: float } ], returns: float }
    - { fn: bounce_step,   ctx: true, args: [ { name: dt, type: float } ] }   # 兼容旧脚本（自 M6 起为 no-op）
    - { fn: physics_step,  ctx: true }                                       # 固定步长物理推进（docs/15 §3）
    - { fn: ball_clear,    ctx: true }
    # 组件字段（脚本改文本等；引擎按 role 定位组件，不认具体类型名）
    - { fn: set_label,     ctx: true, args: [ { name: id, type: float }, { name: text, type: string } ] }
    - { fn: ui_hit_at,     ctx: true, args: [ { name: x, type: float }, { name: y, type: float } ], returns: float }
    # 导航（确定性 2D 网格 A*）：建网格 / 设障碍 / 指定目标 / 查询路径长度
    - { fn: nav_setup,     ctx: true, args: [ { name: cols, type: float }, { name: rows, type: float },
                                             { name: cell, type: float } ] }
    - { fn: nav_block,     ctx: true, args: [ { name: cx, type: float }, { name: cy, type: float },
                                             { name: w, type: float }, { name: h, type: float } ] }
    - { fn: nav_goto,      ctx: true, args: [ { name: id, type: float }, { name: x, type: float },
                                             { name: y, type: float } ], returns: float }
    - { fn: nav_path_len,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: nav_tick,      ctx: true }

    # ---- 节点/组件 API（节点 / 组件 / Director 三件套）----
    # 层级（setParent / parent / children / getChildByName）
    - { fn: node_set_parent,     ctx: true, args: [ { name: id, type: float }, { name: parent, type: float } ], returns: float }
    - { fn: node_parent,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_child_count,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_child_at,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float }
    - { fn: node_find_child,     ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float }
    - { fn: node_set_name,       ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ] }
    # 节点属性（active / scale / angle / opacity / zIndex / contentSize / anchor）
    - { fn: node_set_active,     ctx: true, args: [ { name: id, type: float }, { name: on, type: float } ] }
    - { fn: node_active,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_scale,      ctx: true, args: [ { name: id, type: float }, { name: s, type: float } ] }
    - { fn: node_scale,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_angle,      ctx: true, args: [ { name: id, type: float }, { name: deg, type: float } ] }
    - { fn: node_angle,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_opacity,    ctx: true, args: [ { name: id, type: float }, { name: a, type: float } ] }
    - { fn: node_opacity,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_z_index,    ctx: true, args: [ { name: id, type: float }, { name: z, type: float } ] }
    - { fn: node_z_index,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_width,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_height,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_position,   ctx: true, args: [ { name: id, type: float }, { name: x, type: float }, { name: y, type: float } ] }
    - { fn: node_position_x,     ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_position_y,     ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_content_size, ctx: true, args: [ { name: id, type: float }, { name: w, type: float }, { name: h, type: float } ] }
    - { fn: node_set_anchor,     ctx: true, args: [ { name: id, type: float }, { name: ax, type: float }, { name: ay, type: float } ] }
    # 组件（getComponent / addComponent / getComponentInChildren 等价）
    - { fn: node_has_component,  ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_add_component,  ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_remove_component, ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_component_count, ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_component_at,   ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: node_child_with_component, ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    # 组件字段（反射读写：字段反射读写）
    - { fn: node_get_number,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: float }
    - { fn: node_set_number,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: float } ], returns: float }
    - { fn: node_get_bool,       ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: float }
    - { fn: node_set_bool,       ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: float } ], returns: float }
    - { fn: node_get_string,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: string }
    - { fn: node_set_string,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: string } ], returns: float }
    # 事件（node.on / off / emit；emit 沿父链冒泡，沿父链冒泡）
    - { fn: node_on,             ctx: true, args: [ { name: id, type: float }, { name: event, type: string }, { name: handler, type: string } ], returns: float }
    - { fn: node_off,            ctx: true, args: [ { name: id, type: float }, { name: event, type: string } ], returns: float }
    - { fn: node_emit,           ctx: true, args: [ { name: id, type: float }, { name: event, type: string } ], returns: float }
    - { fn: node_emit_number,    ctx: true, args: [ { name: id, type: float }, { name: event, type: string }, { name: value, type: float } ], returns: float }
    # UI 控件值（按 role 统一读写：ProgressBar / Slider / CheckBox）
    - { fn: ui_set_value,        ctx: true, args: [ { name: id, type: float }, { name: v, type: float } ], returns: float }
    - { fn: ui_get_value,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_set_checked,      ctx: true, args: [ { name: id, type: float }, { name: on, type: float } ], returns: float }
    - { fn: ui_get_checked,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 画布 / 分辨率策略（docs/17）：设计分辨率 → 设备像素的适配结果
    - { fn: window_w,         ctx: true, args: [], returns: float, doc: "绘制区宽（设备像素；HiDPI 下大于 screen_w）" }
    - { fn: window_h,         ctx: true, args: [], returns: float }
    - { fn: canvas_scale,     ctx: true, args: [], returns: float, doc: "设计 → 设备 的等比缩放" }
    - { fn: canvas_scale_x,   ctx: true, args: [], returns: float }
    - { fn: canvas_scale_y,   ctx: true, args: [], returns: float }
    - { fn: canvas_offset_x,  ctx: true, args: [], returns: float, doc: "画布原点的绘制区偏移（留边）" }
    - { fn: canvas_offset_y,  ctx: true, args: [], returns: float }
    - { fn: canvas_device_scale, ctx: true, args: [], returns: float, doc: "显示器内容缩放（HiDPI）" }
    - { fn: canvas_safe_area, ctx: true, args: [ { name: edge, type: float } ], returns: float,
        doc: "安全区内缩（0=左 1=上 2=右 3=下，设备像素）" }
    # 文本（Label / TextLabel / RichText 通用：按 role 读写）
    - { fn: ui_set_text,    ctx: true, args: [ { name: id, type: float }, { name: text, type: string } ], returns: float }
    - { fn: ui_get_text,    ctx: true, args: [ { name: id, type: float } ], returns: string }
    - { fn: ui_text_width,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_text_height, ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_text_lines,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    # Director（暂停/恢复/帧号/切场景；切场景在帧边界生效）
    - { fn: director_pause,      ctx: true }
    - { fn: director_resume,     ctx: true }
    - { fn: director_paused,     ctx: true, returns: float }
    - { fn: director_frame,      ctx: true, returns: float }
    - { fn: director_load_scene, ctx: true, args: [ { name: path, type: string } ], returns: float }

    # ---- 常用 API 续：Tween / schedule / destroy / find(path) ----
    # Tween（确定性：固定步长推进，完成时派发 tween_complete）
    - { fn: tween_start,   ctx: true, args: [ { name: id, type: float }, { name: field, type: string },
                                             { name: to, type: float }, { name: duration, type: float },
                                             { name: easing, type: float } ], returns: float }
    - { fn: tween_stop,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: tween_count,   ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: tween_progress, ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 定时器（帧驱动，确定性；delay/interval 以秒计）
    - { fn: schedule_once, ctx: true, args: [ { name: handler, type: string }, { name: delay, type: float } ], returns: float }
    - { fn: schedule,      ctx: true, args: [ { name: handler, type: string }, { name: interval, type: float } ], returns: float }
    - { fn: unschedule,    ctx: true, args: [ { name: handler, type: string } ], returns: float }
    - { fn: schedule_count, ctx: true, returns: float }
    # 节点销毁（延迟到帧边界，帧末生效）+ 路径查找 find("Canvas/Panel")
    - { fn: node_destroy,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_valid,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_find_path, ctx: true, args: [ { name: root, type: float }, { name: path, type: string } ], returns: float }

# 插件接口 ABI（由 DSL 生成 C vtable；docs/02/21）。opaque self = void*。
- interface: renderer
  version: 1
  records:
    - record: view
      fields:
        - { name: vx,   type: float }      # 视口（帧缓冲内，像素）
        - { name: vy,   type: float }
        - { name: vw,   type: float }
        - { name: vh,   type: float }
        - { name: pan,  type: float }      # 眼睛横向偏移（VR/多视图）
        - { name: eye,  type: float }
        - { name: cx,   type: float }      # 相机中心（世界坐标）
        - { name: cy,   type: float }
        - { name: zoom, type: float }      # 缩放（1 = 1:1）
        - { name: rot,  type: float }      # 旋转（弧度）
    - record: item
      fields:
        - { name: x,        type: float }
        - { name: y,        type: float }
        - { name: size,     type: float }
        - { name: r,        type: float }
        - { name: g,        type: float }
        - { name: b,        type: float }
        - { name: a,        type: float }
        - { name: texture,  type: int32_t }
        - { name: rotation, type: float }  # 图元自转（弧度）
        - { name: half_w,   type: float }  # 非方形矩形半宽（<=0 → 回退到 size，兼容旧调用）
        - { name: half_h,   type: float }  # 非方形矩形半高（<=0 → 回退到 size）
        - { name: filter,   type: int32_t } # 采样过滤：0=linear（默认，精灵缩放），1=nearest（字形/像素画）
        - { name: snap,     type: int32_t } # 1 = 位置四舍五入到整数目标像素（pixel-perfect）
        - { name: uv0,      type: float }  # 纹理子矩形（图集/字形）；全 0 或退化 → 整张贴图
        - { name: uv1,      type: float }
        - { name: uv2,      type: float }
        - { name: uv3,      type: float }
        - { name: layer,    type: int32_t } # 分层（docs/13 §分层：先按 layer 排序）
        - { name: z,        type: int32_t } # 同层内 z-order（稳定排序）
  methods:
    - fn: create
      returns: self
      args: [ { name: out_backend, type: "const char**" } ]
    - fn: destroy
      args: [ { name: self, type: self } ]
    - fn: destroy_texture
      returns: void
      args: [ { name: self, type: "self" }, { name: id, type: "int32_t" } ]
      doc: "释放纹理（字形图集增长后替换旧纹理用；id 无效则忽略）"
    - fn: create_texture
      returns: int32_t
      args: [ { name: self, type: self }, { name: rgba, type: "const uint8_t*" }, { name: w, type: int32_t }, { name: h, type: int32_t } ]
    - fn: has_texture
      returns: int32_t
      args: [ { name: self, type: self }, { name: id, type: int32_t } ]
    - fn: render_views
      returns: int32_t
      args: [ { name: self, type: self }, { name: tw, type: int32_t }, { name: th, type: int32_t }, { name: views, type: "const mq_renderer_view*" }, { name: nviews, type: uint32_t }, { name: items, type: "const mq_renderer_item*" }, { name: count, type: uint32_t }, { name: bg, type: "const float*" }, { name: out, type: "uint8_t*" }, { name: out_size, type: uint32_t } ]

# 控制平面方法（AI/工具公开面，docs/11 §3、docs/21 §6.3）：声明一次 → 生成
#   · maque_control.h      处理器声明（引擎只实现语义）
#   · maque_control_gen.cpp 注册表（runtime 不再手写 mq_control_register）
#   · 类型化 MCP inputSchema（供 tools/list 返回给 AI）
# type: float/string/bool/json；json = 任意 JSON 值（对象/数组）。
- namespace: control
  version: 1
  # 变更类方法（权限单一真相，D2 默认只读）：只读会话对这些方法返回 -32001
  control_mutating: [ Scene.set, Scene.spawn, Scene.destroy, Scene.bake, Scene.save, Scene.emit,
                      Runtime.step, Director.pause, Director.resume, World.restore,
                      Replay.seek, Input.sim_load, Input.sim_stop, Input.inject,
                      Reload.script, Reload.scene, Reload.files ]
  control_list:
    # ---- 自省（A1）----
    - { method: Control.info,  args: [] }
    # ---- 字体图集（动态图集可视化，inspector 字体面板；plans/17 M2）----
    - { method: Font.info,     args: [] }
    - { method: Font.glyphs,   args: [ { name: index, type: float }, { name: size, type: float } ] }
    - { method: Font.atlas,    args: [ { name: index, type: float }, { name: size, type: float },
                                       { name: offset, type: float }, { name: max, type: float } ] }
    # ---- 画面抓帧（实时预览面板；PPM + base64 分块）----
    - { method: Capture.screen, args: [ { name: offset, type: float }, { name: max, type: float },
                                        { name: max_dim, type: float } ] }
    - { method: Types.describe, args: [] }
    - { method: Scene.info, args: [] }
    - { method: Scene.entities, args: [] }
    # 宿主/工具 → 脚本：触发节点事件（与脚本内 node_emit_number 同一路径；多语言按处理器名路由）
    - { method: Scene.emit,   args: [ { name: id, type: float }, { name: event, type: string },
                                      { name: value, type: float } ] }
    - { method: Scene.get,    args: [ { name: id, type: float }, { name: path, type: string } ] }
    # ---- 编辑（A5、docs/11 §4：破坏性操作支持 dry_run）----
    - { method: Scene.set,     args: [ { name: id, type: float  }, { name: path, type: string },
                                       { name: value, type: json }, { name: dry_run, type: bool } ] }
    - { method: Scene.spawn,   args: [ { name: name, type: string  }, { name: parent, type: float },
                                       { name: component, type: string }, { name: dry_run, type: bool } ] }
    - { method: Scene.destroy, args: [ { name: id, type: float  }, { name: dry_run, type: bool } ] }
    - { method: Scene.bake,    args: [ { name: dry_run, type: bool  } ] }
    - { method: Scene.save,    args: [ { name: path, type: string  } ] }
    # ---- 运行与帧（A4）----
    - { method: Runtime.step,  args: [ { name: frames, type: float  } ] }
    - { method: Runtime.frame, args: [] }
    - { method: Director.pause,  args: []  }
    - { method: Director.resume, args: []  }
    - { method: Director.status, args: [] }
    # ---- 确定性（A3、docs/10）----
    - { method: World.checksum, args: [] }
    - { method: World.trail,    args: [] }
    - { method: World.snapshot, args: [] }
    - { method: World.restore,  args: []  }
    - { method: Replay.log,         args: [] }
    - { method: Replay.checkpoints, args: [] }
    - { method: Replay.seek,        args: [ { name: frame, type: float  } ] }
    # ---- 输入注入（docs/19 §9）----
    # ---- 输入模拟器（docs/19：开发/自动化/演示；帧索引场景文件）----
    - { method: Input.sim_load,   args: [ { name: path, type: string  }, { name: json, type: string },
                                          { name: loop, type: bool }, { name: reset, type: bool } ] }
    - { method: Input.sim_status, args: [] }
    - { method: Input.sim_events, args: [] }
    - { method: Input.sim_stop,   args: []  }
    - { method: Input.inject, args: [ { name: type, type: float  }, { name: x, type: float },
                                      { name: y, type: float }, { name: button, type: float },
                                      { name: key, type: float } ] }
    # ---- 性能与日志（A2）----
    - { method: Perf.get, args: [] }
    # ---- 热重载（docs/08/14）----
    - { method: Reload.script, args: [ { name: dry_run, type: bool  } ] }
    - { method: Reload.scene,  args: [ { name: dry_run, type: bool  } ] }
    - { method: Reload.files,  args: []  }
    # ---- MCP 包装（docs/11 §2）----
    - { method: Control.mcp, args: [ { name: method, type: string }, { name: request, type: string },
                                     { name: name, type: string }, { name: arguments, type: json } ] }


# 模块 C ABI（docs/02「跨模块只暴露 C ABI + 版本化」、docs/21「声明一次」）：
# 生成的 abi/<module>.h 与原手写头**逐条等价**；原头改为 #include shim，消费者路径不变。
  module_abi:
    module: control
    abi_name: "maque.control"
    includes: [ "\"core/persist/mq_persist.h\"", "<stddef.h>" ]
    opaque: [ mq_control, mq_control_server ]
    typedefs:
      - { name: mq_control_handler, type: "int (*)(void* user, const char* method,
                                  const mq_json* params, char* out, size_t out_cap)" }
      - { name: mq_control_tools_json_fn, type: "const char* (*)(void* user)" }
    fns:
      - { fn: mq_control_create, returns: "mq_control*", args: [  ] }
      - { fn: mq_control_destroy, returns: "void", args: [ { name: c, type: "mq_control*" } ] }
      - { fn: mq_control_register, returns: "void", args: [ { name: c, type: "mq_control*" }, { name: method, type: "const char*" }, { name: fn, type: "mq_control_handler" }, { name: user, type: "void*" } ] }
      - { fn: mq_control_dispatch, returns: "const char*", args: [ { name: c, type: "mq_control*" }, { name: request, type: "const char*" } ] }
      - { fn: mq_control_method_count, returns: "uint32_t", args: [ { name: c, type: "mq_control*" } ] }
      - { fn: mq_control_method_at, returns: "const char*", args: [ { name: c, type: "mq_control*" }, { name: index, type: "uint32_t" } ] }
      - { fn: mq_control_set_tools_handler, returns: "void", args: [ { name: c, type: "mq_control*" }, { name: fn, type: "mq_control_handler" }, { name: user, type: "void*" } ] }
      - { fn: mq_control_set_tools_json, returns: "void", args: [ { name: c, type: "mq_control*" }, { name: fn, type: "mq_control_tools_json_fn" }, { name: user, type: "void*" } ] }
      - { fn: mq_control_is_mutating, returns: int, args: [ { name: method, type: "const char*" } ],
          doc: "该方法是否为变更类（权限判定；由 control_list 的 mutating 标记生成）" }
      # ---- 控制端点（inspector 用；docs/09/11、plans/17 §3）：单线程、非阻塞、帧边界轮询 ----
      - { fn: mq_control_server_create, returns: "mq_control_server*", args: [ { name: c, type: "mq_control*" }, { name: spec, type: "const char*" }, { name: read_only, type: "int" } ],
          doc: "监听端点：spec = \"tcp:7777\" / \"uds:/tmp/x.sock\" / \"7777\"（仅回环）；read_only=1 时拒绝变更类方法" }
      - { fn: mq_control_server_poll, returns: int, args: [ { name: s, type: "mq_control_server*" } ],
          doc: "帧边界轮询：非阻塞收发（单线程、不改确定性）；返回本次处理的消息数" }
      - { fn: mq_control_server_clients, returns: "uint32_t", args: [ { name: s, type: "mq_control_server*" } ] }
      - { fn: mq_control_server_url, returns: "const char*", args: [ { name: s, type: "mq_control_server*" } ],
          doc: "实际监听地址（tcp://127.0.0.1:7777 或 uds:///tmp/…）——inspector 据此 attach" }
      - { fn: mq_control_server_rejected, returns: "uint32_t", args: [ { name: s, type: "mq_control_server*" } ],
          doc: "因权限被拒绝的变更请求数（只读会话可见）" }
      - { fn: mq_control_server_destroy, returns: void, args: [ { name: s, type: "mq_control_server*" } ] }
      - { fn: mq_control_dispatch_mcp, returns: "const char*", args: [ { name: c, type: "mq_control*" }, { name: request, type: "const char*" } ] }

- namespace: vfs
  version: 1
  module_abi:
    module: vfs
    abi_name: "maque.vfs"
    summary: "虚拟文件系统：挂载点 + 多协议后端（docs/04）"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    opaque: [ mq_vfs ]
    enums:
      - doc: "错误码（结构化；docs/11 §4）。"
        values:
          - { name: MQ_VFS_OK,           value: 0, doc: "成功" }
          - { name: MQ_VFS_ERR_ARG,      value: 1, doc: "空指针/非法参数" }
          - { name: MQ_VFS_ERR_NO_MOUNT, value: 2, doc: "无匹配挂载点" }
          - { name: MQ_VFS_ERR_NOTFOUND, value: 3, doc: "挂载内不存在" }
          - { name: MQ_VFS_ERR_NOMEM,    value: 4, doc: "内存不足" }
          - { name: MQ_VFS_ERR_FORMAT,   value: 5, doc: "容器格式损坏（如 zip 头）" }
          - { name: MQ_VFS_ERR_IO,       value: 6, doc: "网络/磁盘 IO" }
          - { name: MQ_VFS_ERR_HASH,     value: 7, doc: "内容哈希不匹配（远程资产校验）" }
    fns:
