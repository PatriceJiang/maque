# anim —— 世界层动画组件（尚无独立模块目录）
- imports: [../math.yaml]

- namespace: anim
  version: 1
  class_list:
    - enum: LoopMode
      values:
        - { name: Once, value: 0 }
        - { name: Loop, value: 1 }
        - { name: PingPong, value: 2 }
        - { name: ClampForever, value: 3 }
    - enum: PlayMode
      values:
        - { name: Once, value: 0 }
        - { name: Loop, value: 1 }
        - { name: PingPong, value: 2 }
        - { name: ClampForever, value: 3 }
    - enum: UpdateMode
      values:
        - { name: Process, value: 0 }
        - { name: Physics, value: 1 }
    - enum: InterpMode
      values:
        - { name: Inherit, value: -1 }
        - { name: Step, value: 0 }
        - { name: Linear, value: 1 }
        - { name: Cubic, value: 2 }
    - enum: AnimParamType
      values:
        - { name: Float, value: 0 }
        - { name: Int, value: 1 }
        - { name: Bool, value: 2 }
        - { name: Trigger, value: 3 }
    - enum: TransitionMode
      values:
        - { name: Interrupt, value: 0 }
        - { name: WhenDone, value: 1 }
    - enum: SkinningMode
      values:
        - { name: Linear, value: 0 }
        - { name: DualQuat, value: 1 }
    - enum: ShapeType
      values:
        - { name: Point, value: 0 }
        - { name: Circle, value: 1 }
        - { name: Box, value: 2 }
        - { name: Sphere, value: 3 }
        - { name: Hemisphere, value: 4 }
        - { name: Cone, value: 5 }
        - { name: Edge, value: 6 }
    - enum: SimSpace
      values:
        - { name: Local, value: 0 }
        - { name: World, value: 1 }
    - enum: ParticleMode
      values:
        - { name: CPU, value: 0 }
        - { name: GPU, value: 1 }
    - enum: BlendMode
      values:
        - { name: Alpha, value: 0 }
        - { name: Additive, value: 1 }
        - { name: Multiply, value: 2 }
    - enum: SortMode
      values:
        - { name: None, value: 0 }
        - { name: ByDepth, value: 1 }
        - { name: ByAge, value: 2 }
    - enum: FlipMode
      values:
        - { name: None, value: 0 }
        - { name: Horizontal, value: 1 }
        - { name: Vertical, value: 2 }
        - { name: Both, value: 3 }
    - enum: SpineBlend
      values:
        - { name: Setup, value: 0 }
        - { name: First, value: 1 }
        - { name: Replace, value: 2 }
        - { name: Add, value: 3 }
        - { name: Multiply, value: 4 }
        - { name: Screen, value: 5 }
    - enum: SpinePhysTimestep
      values:
        - { name: Inherit, value: 0 }
        - { name: Fixed, value: 1 }
        - { name: NoPhysics, value: 2 }
    - enum: SpineUpdate
      values:
        - { name: Process, value: 0 }
        - { name: Physics, value: 1 }
    - struct: GradientStop
      size: 20
      fields:
        - { name: t, type: float, default: 0.0F, attrs: { range: [0, 1] } }
        - { name: color, type: math.Rgba }
    - struct: Gradient
      size: 164
      fields:
        - { name: count, type: uint8_t, default: 0, attrs: { range: [0, 8] } }
        - { name: stops, type: "GradientStop[8]" }
    - struct: CurveKey
      size: 16
      fields:
        - { name: t, type: float, default: 0.0F }
        - { name: value, type: float, default: 0.0F }
        - { name: in_tangent, type: float, default: 0.0F }
        - { name: out_tangent, type: float, default: 0.0F }
    - struct: Curve
      fields:
        - { name: interp, type: InterpMode, default: "InterpMode::Linear" }
        - { name: count, type: uint8_t, default: 0, attrs: { range: [0, 8] } }
        - { name: keys, type: "CurveKey[8]" }
    - struct: AnimParam
      size: 16
      fields:
        - { name: name_hash, type: uint32_t, default: 0 }
        - { name: type, type: AnimParamType, default: "AnimParamType::Float" }
        - { name: value, type: float, default: 0.0F }
        - { name: ivalue, type: int32_t, default: 0 }
    - struct: BonePose
      size: 40
      fields:
        - { name: position, type: math.Vec3 }
        - { name: rotation, type: math.Quat }
        - { name: scale, type: math.Vec3, default: "{1.0F, 1.0F, 1.0F}" }
    - struct: SpineAnimState
      fields:
        - { name: time, type: float, default: 0.0F, attrs: { unit: s } }
        - { name: track, type: int32_t, default: 0 }
        - { name: loop, type: bool, default: false }
    - struct: AnimationPlayer
      fields:
        - { name: clip, type: "asset_ref<AnimationClip>", attrs: { ref: AnimationClip } }
        - { name: autoplay, type: bool, default: true }
        - { name: loop, type: LoopMode, default: "LoopMode::Loop" }
        - { name: update_mode, type: UpdateMode, default: "UpdateMode::Process" }
        - { name: speed, type: float, default: 1.0F, attrs: { range: [0, 100] } }
        - { name: playing, type: bool, default: false }
        - { name: time, type: float, default: 0.0F, attrs: { readonly: true, unit: s } }
        - { name: track_mask, type: uint64_t, default: "0xFFFFFFFFFFFFFFFFULL" }
        - { name: event_sink, type: entity_ref, attrs: { ref: Script } }
    - struct: Animator
      fields:
        - { name: controller, type: "asset_ref<AnimatorController>", attrs: { ref: AnimatorController } }
        - { name: parameters, type: "AnimParam[16]" }
        - { name: param_count, type: uint8_t, default: 0, attrs: { readonly: true } }
        - { name: current_state, type: uint32_t, default: 0, attrs: { transient: true, readonly: true } }
        - { name: normalized_time, type: float, default: 0.0F, attrs: { transient: true, readonly: true, range: [0, 1] } }
        - { name: speed, type: float, default: 1.0F, attrs: { range: [0, 100] } }
        - { name: apply_physics, type: bool, default: false }
        - { name: target, type: entity_ref, attrs: { ref: AnimationPlayer } }
    - struct: Skeleton
      fields:
        - { name: skeleton, type: "asset_ref<SkeletonData>", attrs: { ref: SkeletonData } }
        - { name: bone_root, type: entity_ref, attrs: { ref: "scene.Node" } }
        - { name: skinning_mode, type: SkinningMode, default: "SkinningMode::Linear" }
        - { name: poses, type: "BonePose[]", attrs: { transient: true } }
        - { name: skinning_matrices, type: "math.Mat4[]", attrs: { transient: true } }
        - { name: bounds, type: math.Aabb, attrs: { transient: true, readonly: true } }
    - struct: ParticleEmitter
      fields:
        - { name: mode, type: ParticleMode, default: "ParticleMode::CPU" }
        - { name: sim_space, type: SimSpace, default: "SimSpace::Local" }
        - { name: texture, type: "asset_ref<Texture>", attrs: { ref: Texture } }
        - { name: material, type: "asset_ref<Material>", attrs: { ref: Material } }
        - { name: blend, type: BlendMode, default: "BlendMode::Additive" }
        - { name: shape, type: ShapeType, default: "ShapeType::Point" }
        - { name: shape_size, type: math.Vec3, attrs: { unit: m } }
        - { name: shape_angle, type: float, default: 0.0F, attrs: { unit: deg, range: [0, 180] } }
        - { name: rate, type: float, default: 10.0F, attrs: { range: [0, 100000], unit: "1/s" } }
        - { name: burst_count, type: uint16_t, default: 0 }
        - { name: lifetime, type: Curve, attrs: { unit: s } }
        - { name: start_speed, type: Curve, attrs: { unit: "m/s" } }
        - { name: gravity, type: math.Vec3, default: "{0.0F, -9.8F, 0.0F}", attrs: { unit: "m/s2" } }
        - { name: start_size, type: Curve }
        - { name: size_over_life, type: Curve }
        - { name: color_over_life, type: Gradient }
        - { name: max_particles, type: uint32_t, default: 1000, attrs: { range: [0, 1000000] } }
        - { name: seed, type: uint32_t, default: 0 }
        - { name: prewarm, type: float, default: 0.0F, attrs: { unit: s } }
        - { name: emit, type: bool, default: true }
        - { name: sort_mode, type: SortMode, default: "SortMode::None" }
        - { name: rng_state, type: uint64_t, default: 0, attrs: { transient: true } }
    - struct: AnimatedSprite
      fields:
        - { name: frames, type: "asset_ref<SpriteFrames>", attrs: { ref: SpriteFrames } }
        - { name: animation, type: uint32_t, default: 0 }
        - { name: autoplay, type: bool, default: true }
        - { name: play_mode, type: PlayMode, default: "PlayMode::Loop" }
        - { name: fps, type: float, default: 10.0F, attrs: { range: [0.0001, 240] } }
        - { name: speed, type: float, default: 1.0F, attrs: { range: [0, 100] } }
        - { name: frame, type: uint16_t, default: 0, attrs: { range: [0, 65535] } }
        - { name: time, type: float, default: 0.0F, attrs: { readonly: true, unit: s } }
        - { name: playing, type: bool, default: false }
        - { name: flip, type: FlipMode, default: "FlipMode::None" }
        - { name: color, type: math.Color }
        - { name: pivot, type: math.Vec2, default: "{0.5F, 0.5F}", attrs: { unit: normalized } }
        - { name: z_index, type: int32_t, default: 0 }
        - { name: material, type: "asset_ref<Material>", attrs: { ref: Material } }
    - struct: SpineSkeleton
      roles: [spine_skeleton]     # 引擎按 role 定位（docs/12 §7：不硬编码组件类型）
      fields:
        # 资源引用用**稳定路径字符串**（与 scn.Sprite.texture/material 同一约定）。
        # 为什么不用 asset_ref<SpineData>：asset_ref 是**内容哈希句柄**（persist 序列化成 "0x…"），
        # 场景作者无法手写路径，而 spine 的骨架/图集恰恰是"按路径去 VFS 读"（远程素材同理）。
        - { name: skeleton, type: string, default: "" }     # 骨架：.skel = 二进制 / .json = 文本
        - { name: atlas,    type: string, default: "" }     # 图集 .atlas；空 → 用 material / 与骨架同名
        - { name: skin, type: uint32_t, default: 0 }        # 皮肤下标（声明序）
        - { name: animation, type: uint32_t, default: 0 }   # 动画下标（声明序；脚本可改，改了就真的切）
        - { name: autoplay, type: bool, default: true }
        - { name: play_mode, type: PlayMode, default: "PlayMode::Loop" }
        - { name: speed, type: float, default: 1.0F, attrs: { range: [0, 100] } }
        - { name: blend, type: SpineBlend, default: "SpineBlend::Replace" }
        - { name: update_mode, type: SpineUpdate, default: "SpineUpdate::Process" }
        - { name: phys_timestep, type: SpinePhysTimestep, default: "SpinePhysTimestep::Inherit" }
        - { name: flip, type: FlipMode, default: "FlipMode::None" }
        - { name: color, type: math.Color }
        - { name: z_index, type: int32_t, default: 0 }
        - { name: material, type: string, default: "" }     # 兼容/别名：spine 用它指向 .atlas（见 atlas）
        # 槽区间（SkeletonRendererSeparator demo：同一骨架拆成"后段/前段"两次渲染，
        # 中间夹别的节点）。数值 = **槽声明序下标**（= 官方 findSlot(name)->getData().getIndex()），
        # to < 0 → 到末尾；from < 0 → 不限制（整只画）。区间按 getData().getIndex() 判定，
        # 不随 draw order timeline 漂移。
        - { name: slots_from, type: int32_t, default: -1 }
        - { name: slots_to,   type: int32_t, default: -1 }
        # AnimationStateData::setDefaultMix：换动画时的默认混合时长（0 = 硬切）。
        # 官方 C++ 入口 demo（glfw/sdl）用 0.2；Batching/Separator 用 setMix 指定特定动画对。
        - { name: default_mix, type: float, default: 0.0F, attrs: { unit: s, range: [0, 10] } }
        # AnimationState 全局时间缩放（与 speed 相乘；官方 Coin/Tank 的 setTimeScale(0.3)）
        - { name: time_scale, type: float, default: 1.0F, attrs: { range: [0, 100] } }
        # 官方 setTwoColorTint(on) 的落点：本引擎网格恒定走两色着色路径（暗色通道始终产出，
        # 素材无 dark 时 = (0,0,0,1) → 与关闭逐字节等价），故这只是"如实记录调用"，不改输出。
        - { name: two_color, type: bool, default: false }
        - { name: state, type: SpineAnimState, attrs: { transient: true, readonly: true } }
        - { name: instance, type: uint64_t, default: 0, attrs: { transient: true, readonly: true } }

  # Spine 2D 官方运行时接入（docs/assets/06 §2、docs/15 §2）。
  # 分层取舍（重要）：本模块**只产出绘制数据**（顶点/UV/颜色/索引 + 图集页号），
  # **不碰 GPU 也不解码纹理** —— 图集页的读取与解码由引擎侧（runtime + image 模块）完成后
  # 通过 mq_spine_page_texture 回填句柄。这样 spine2d 不依赖 gfx/image，符合模块分层
  # （docs/02），也让"页面从哪来"（VFS/内存/远程）完全由引擎决定。
  module_abi:
    module: spine2d
    abi_name: "maque.spine2d"
    summary: "Spine 2D 官方运行时（spine-cpp）的 C ABI 封装：骨架数据 + 实例 + 绘制数据（docs/assets/06 §2）"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    opaque: [ mq_spine_data, mq_spine_instance, mq_spine_skin ]
    enums:
      - doc: "错误码（结构化；docs/11 §4）"
        values:
          - { name: MQ_SPINE_OK,           value: 0 }
          - { name: MQ_SPINE_ERR_ARG,      value: 1, doc: "空指针/非法数值" }
          - { name: MQ_SPINE_ERR_FORMAT,   value: 2, doc: "骨架或图集解析失败（格式/版本不匹配）" }
          - { name: MQ_SPINE_ERR_NOTFOUND, value: 3, doc: "动画名/皮肤名不存在" }
          - { name: MQ_SPINE_ERR_PAGE,     value: 4, doc: "图集页纹理未回填" }
          - { name: MQ_SPINE_ERR_NOMEM,    value: 5 }
      - doc: "动画事件类型（值与 spine::EventType 相同：start/interrupt/end/complete/dispose/event）"
        name: mq_spine_event_type
        values:
          - { name: MQ_SPINE_EVENT_START,     value: 0, doc: "某轨开始播一个动画" }
          - { name: MQ_SPINE_EVENT_INTERRUPT, value: 1, doc: "被同轨的新动画打断" }
          - { name: MQ_SPINE_EVENT_END,       value: 2, doc: "轨上动画结束（非循环播完/被清）" }
          - { name: MQ_SPINE_EVENT_COMPLETE,  value: 3, doc: "至少播完一轮（循环动画每轮都发）" }
          - { name: MQ_SPINE_EVENT_DISPOSE,   value: 4, doc: "轨条目被销毁" }
          - { name: MQ_SPINE_EVENT_EVENT,     value: 5, doc: "用户事件（动画里 key 的 event）" }
      - doc: "世界变换/物理的更新时间轴（值与 spine::Physics 相同）"
        name: mq_spine_physics
        values:
          - { name: MQ_SPINE_PHYSICS_NONE,   value: 0, doc: "不更新也不应用物理" }
          - { name: MQ_SPINE_PHYSICS_RESET,  value: 1, doc: "物理重置到当前姿势" }
          - { name: MQ_SPINE_PHYSICS_UPDATE, value: 2, doc: "更新物理并应用（默认）" }
          - { name: MQ_SPINE_PHYSICS_POSE,   value: 3, doc: "不更新、只应用已有物理姿势" }
      - doc: "PhysicsConstraint 的浮点字段（mq_spine_instance_physics_set_float 的 field）"
        name: mq_spine_physics_field
        values:
          - { name: MQ_SPINE_PHYS_INERTIA,      value: 0 }
          - { name: MQ_SPINE_PHYS_STRENGTH,     value: 1 }
          - { name: MQ_SPINE_PHYS_DAMPING,      value: 2 }
          - { name: MQ_SPINE_PHYS_MASS_INVERSE, value: 3 }
          - { name: MQ_SPINE_PHYS_WIND,         value: 4 }
          - { name: MQ_SPINE_PHYS_GRAVITY,      value: 5 }
          - { name: MQ_SPINE_PHYS_MIX,          value: 6 }
    structs:
      - doc: "图集页（一页 = 一张纹理；多页图集如 dragon 有 5 页）"
        name: mq_spine_page
        fields:
          - { name: name, type: "const char*", doc: "页名（图集内声明的纹理文件名）" }
          - { name: width, type: int, doc: "像素宽（回填后有效）" }
          - { name: height, type: int }
          - { name: texture, type: "uint64_t", doc: "引擎侧纹理句柄（回填；0 = 未回填）" }
          - { name: pma, type: int, doc: "1 = 页纹理是**预乘 alpha**（图集里的 `pma: true`）→ 渲染侧须用相应混合方程" }
      - doc: "绘制批次：同一图集页 + 同一混合模式的一段连续索引（spine 的批处理结果）"
        name: mq_spine_batch
        fields:
          - { name: page, type: int, doc: "mq_spine_page 下标；-1 = 无纹理（如纯色占位）" }
          - { name: blend, type: int, doc: "spine 混合模式原值（0=Normal,1=Additive,2=Multiply,3=Screen）" }
          - { name: first_index, type: uint32_t, doc: "索引起始（相对 mq_spine_draw 的 indices）" }
          - { name: index_count, type: uint32_t }
      - doc: "一帧绘制数据。顶点按 2 分量（x,y，**骨架子空间**：与 Spine 编辑器一致、y 向上）打包；uv 按 2 分量归一化到**整张图集页**（不是区域局部）。引擎渲染目标是 y 向下 → 由上层翻一次 y（见 runtime::spine_step）。"
        name: mq_spine_draw
        fields:
          - { name: vertex_count, type: int }
          - { name: index_count, type: int }
          - { name: batch_count, type: int }
          - { name: bounds_x, type: float, doc: "姿势包围盒（绘制数据空间，可选用于剔除）" }
          - { name: bounds_y, type: float }
          - { name: bounds_w, type: float }
          - { name: bounds_h, type: float }
      - doc: "一次动画事件（官方 demo 的日志字段：track + 动画名 + 用户事件名 + int/float/string 三个值）。动画名/事件名/字符串值指向骨架数据内部，随 data 存活；无值时字段为 NULL/0。"
        name: mq_spine_event
        fields:
          - { name: type, type: int, doc: "mq_spine_event_type" }
          - { name: track, type: int, doc: "轨下标（TrackEntry::getTrackIndex）" }
          - { name: animation, type: "const char*", doc: "所在轨的动画名（NULL = 无）" }
          - { name: name, type: "const char*", doc: "用户事件名（仅 type=MQ_SPINE_EVENT_EVENT；否则 NULL）" }
          - { name: int_value, type: int, doc: "用户事件的 int 值" }
          - { name: float_value, type: float, doc: "用户事件的 float 值" }
          - { name: string_value, type: "const char*", doc: "用户事件的 string 值（可为 NULL）" }
      - doc: "序列帧附件（Sequence）的当前帧信息：一个附件多张图。动画时间轴只推进 slot 的帧下标，真正换图发生在求值（computeWorldVertices）里，所以**必须按当前帧读区域/UV**，否则永远画第 0 帧。"
        name: mq_spine_sequence_info
        fields:
          - { name: frames, type: int, doc: "序列总帧数（Sequence::getRegions().size()）" }
          - { name: index, type: int, doc: "当前帧下标（-1 = 用 setup 帧）" }
          - { name: setup_index, type: int, doc: "setup 帧下标（Sequence::getSetupIndex）" }
          - { name: id, type: int, doc: "Sequence::getId（同一 Sequence 的稳定标识）" }
          - { name: path, type: "const char*", doc: "当前帧的路径名（Sequence::getPath；指针在本实例下次调用前有效）" }
          - { name: u, type: float, doc: "当前帧区域在整页上的 UV（u/v/u2/v2；逐帧不同）" }
          - { name: v, type: float }
          - { name: u2, type: float }
          - { name: v2, type: float }
          - { name: width, type: int, doc: "当前帧区域像素尺寸" }
          - { name: height, type: int }
    typedefs:
      - { name: mq_spine_texture_cb, type: "int (*)(void* user, const char* page_name, const void* file_data, size_t size, uint64_t* out_texture)" }
      - { name: mq_spine_event_cb, type: "void (*)(void* user, mq_spine_instance* inst, const mq_spine_event* event)" }
    fns:
      - { fn: mq_spine_abi_version, returns: uint32_t, args: [] }
      - { fn: mq_spine_data_create, returns: "mq_spine_data*", args: [ { name: skeleton_data, type: "const void*" }, { name: skeleton_size, type: "size_t" }, { name: skeleton_is_binary, type: int }, { name: atlas_data, type: "const char*" }, { name: atlas_dir_hint, type: "const char*" }, { name: load_texture, type: "mq_spine_texture_cb" }, { name: user, type: "void*" } ] }
      - { fn: mq_spine_data_destroy, returns: void, args: [ { name: data, type: "mq_spine_data*" } ] }
      - { fn: mq_spine_data_animation_count, returns: int, args: [ { name: data, type: "mq_spine_data*" } ] }
      - { fn: mq_spine_data_animation_name, returns: "const char*", args: [ { name: data, type: "mq_spine_data*" }, { name: index, type: int } ] }
      - { fn: mq_spine_data_animation_index, returns: int, args: [ { name: data, type: "mq_spine_data*" }, { name: name, type: "const char*" } ] }
      - { fn: mq_spine_data_skin_count, returns: int, args: [ { name: data, type: "mq_spine_data*" } ] }
      - { fn: mq_spine_data_skin_name, returns: "const char*", args: [ { name: data, type: "mq_spine_data*" }, { name: index, type: int } ] }
      - { fn: mq_spine_data_page_count, returns: int, args: [ { name: data, type: "mq_spine_data*" } ] }
