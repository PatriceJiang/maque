# renderer —— 渲染插件接口（C vtable）· modules/render/gfx
# 插件接口 ABI（由 DSL 生成 C vtable；docs/02/21）。opaque self = void*。
#
# 版本化（docs/02）：本接口 version 保持 1 —— 新能力**只在表尾追加**（记录/方法），
# 既有记录字段与方法签名不变；调用方用 mq_api_header.struct_size 判断新方法是否存在。
# 3D/PBR 扩展见 plans/18-pbr-3d.md §2（直接呈现 / 网格 GPU 资源 / PBR 帧描述）。
- interface: renderer
  version: 1
  records:
    - record: view
      fields:
        - { name: vx,   type: float }      # 视口（帧缓冲内，像素）
        - { name: vy,   type: float }
        - { name: vw,   type: float }
        - { name: vh,   type: float }
        - { name: pan,  type: float }      # 眼睛横向偏移（VR/多视图）
        - { name: eye,  type: float }
        - { name: cx,   type: float }      # 相机中心（世界坐标）
        - { name: cy,   type: float }
        - { name: zoom, type: float }      # 缩放（1 = 1:1）
        - { name: rot,  type: float }      # 旋转（弧度）
    - record: item
      fields:
        - { name: x,        type: float }
        - { name: y,        type: float }
        - { name: size,     type: float }
        - { name: r,        type: float }
        - { name: g,        type: float }
        - { name: b,        type: float }
        - { name: a,        type: float }
        - { name: texture,  type: int32_t }
        - { name: rotation, type: float }  # 图元自转（弧度）
        - { name: half_w,   type: float }  # 非方形矩形半宽（<=0 → 回退到 size，兼容旧调用）
        - { name: half_h,   type: float }  # 非方形矩形半高（<=0 → 回退到 size）
        - { name: filter,   type: int32_t } # 采样过滤：0=linear（默认，精灵缩放），1=nearest（字形/像素画）
        - { name: snap,     type: int32_t } # 1 = 位置四舍五入到整数目标像素（pixel-perfect）
        - { name: uv0,      type: float }  # 纹理子矩形（图集/字形）；全 0 或退化 → 整张贴图
        - { name: uv1,      type: float }
        - { name: uv2,      type: float }
        - { name: uv3,      type: float }
        - { name: layer,    type: int32_t } # 分层（docs/13 §分层：先按 layer 排序）
        - { name: z,        type: int32_t } # 同层内 z-order（稳定排序）
    # 网格图元（spine/骨骼网格/任意三角形网格）：顶点数组 + 索引 + 页纹理。
    # 为什么需要它：item 只能表达"矩形/圆 + 单张贴图 + 每实例一次变换"，
    # 而骨骼动画一帧是**任意四边形/三角形网格**（逐顶点 UV + 逐顶点颜色 + 索引）。
    - record: mesh
      fields:
        - { name: vertices,   type: "const float*" }    # 2 分量/顶点（渲染目标像素空间；y 向下）
        - { name: uvs,        type: "const float*" }    # 2 分量/顶点（归一化）
        - { name: colors,     type: "const float*" }    # 4 分量/顶点（RGBA，逐顶点）= **light 亮色**
        # 两色着色（TintBlack）的 **dark 暗色**一路：4 分量/顶点，长度同 colors。
        # NULL = 未提供 → 用官方默认 0xff000000（rgba(0,0,0,1)），此时着色公式精确退化为
        # "纹理 × light"（与不支持两色着色的旧行为逐字节一致）。可空，故对既有调用方零破坏。
        - { name: dark_colors, type: "const float*" }   # 4 分量/顶点（RGBA，逐顶点）= **dark 暗色**（可空）
        - { name: indices,    type: "const uint32_t*" } # 三角形索引（相对 vertices 起点）
        - { name: vertex_count, type: uint32_t }        # 本网格顶点数（2/4 分量按数组类型）
        - { name: first_index, type: uint32_t }         # 本批次在 indices 内的起点
        - { name: index_count, type: uint32_t }         # 本批次索引数（三角形列表）
        - { name: base_vertex, type: uint32_t }         # 顶点基准（加到每个索引上）
        - { name: texture,    type: int32_t }           # 页纹理句柄（-1 = 无纹理）
        - { name: blend,      type: int32_t }           # 0=normal 1=additive 2=multiply 3=screen
        - { name: pma,        type: int32_t }           # 1 = 纹理是**预乘 alpha**（spine 图集常见）
        - { name: layer,      type: int32_t }
        # 裁剪矩形（渲染目标像素空间；w<=0 或 h<=0 = 不裁剪，用整个视图）。
        # 为什么网格需要它：ImGui 这类即时模式 UI 靠 **scissor** 做"子窗口/文本裁剪/滑块内部"，
        # 没有它内容会溢出到框外（实测：面板文字糊成一片、子窗口压住上面的行）。
        - { name: clip_x,     type: float }
        - { name: clip_y,     type: float }
        - { name: clip_w,     type: float }
        - { name: clip_h,     type: float }
        - { name: z,          type: int32_t }
    # ---- 3D / 直接呈现（plans/18-pbr-3d.md §2；只在表尾追加，旧记录不变）----
    # 原生窗口描述：platform 提供，renderer 用它建 wgpu surface（直接呈现）。
    - record: window
      fields:
        - { name: kind,    type: int32_t }   # 0=none 1=win32 2=xlib 3=wayland
        - { name: display, type: "void*" }   # win32: HINSTANCE；xlib: Display*；wayland: wl_display*
        - { name: handle,  type: "void*" }   # win32: HWND；xlib: Window；wayland: wl_surface*
        - { name: extra,   type: "void*" }   # 预留（xcb connection / cocoa view）
        - { name: width,   type: int32_t }   # 绘制区（设备像素）
        - { name: height,  type: int32_t }
    # 适配器/目标能力（提取与资产 cook 据此选择；不做静默降级）。
    - record: caps
      fields:
        - { name: max_texture_size, type: int32_t }
        - { name: max_lights,       type: int32_t }
        - { name: max_samples,      type: int32_t }
        - { name: target_format,    type: int32_t }  # 0=RGBA8 1=BGRA8 2=RGBA8_SRGB 3=BGRA8_SRGB 4=RGBA16F
        - { name: depth_format,     type: int32_t }  # 0=Depth32Float 1=Depth24Plus 2=Depth24PlusStencil8
        - { name: direct_present,   type: int32_t }  # 1 = swapchain 直呈可用
        - { name: hdr,              type: int32_t }  # 1 = RGBA16F 离屏可用
        - { name: reserved,         type: int32_t }
    # 纹理创建（PBR 需要 sRGB / mip / wrap / filter；2D 字形图集仍走旧 create_texture）。
    - record: texture_desc
      fields:
        - { name: width,        type: int32_t }
        - { name: height,       type: int32_t }
        - { name: pixel_format, type: int32_t }  # 0=RGBA8 1=RGBA8_SRGB 2=RGBA16F（3=BC7 预留）
        - { name: kind,         type: int32_t }  # 0=2D 1=cube（第 26 轮：6 面×mip 链，env IBL 用；data 按 mip→6 面连续）2=equirect（预留）
        - { name: mip_levels,   type: int32_t }  # 1 = 无 mip；data 内各 mip 连续存放
        - { name: filter,       type: int32_t }  # 0=nearest 1=linear（含 mip linear）
        - { name: wrap_u,       type: int32_t }  # 0=repeat 1=clamp 2=mirror
        - { name: wrap_v,       type: int32_t }
        - { name: data,         type: "const uint8_t*" }  # RGBA8 各 mip 连续；cube 为 6 面
        - { name: data_size,    type: uint64_t }
    # 3D 网格（一次性上传，GPU 常驻；规范顶点布局 = pos3/normal3/tangent4/uv2，stride 48B）。
    - record: mesh_gpu
      fields:
        - { name: vertices,      type: "const void*" }
        - { name: vertex_bytes,  type: uint64_t }
        - { name: vertex_stride, type: uint32_t }
        - { name: vertex_layout, type: int32_t }   # 0=PBR 48B
        - { name: indices,       type: "const uint32_t*" }
        - { name: index_count,   type: uint32_t }
        - { name: bounds_min,    type: "float[3]" }
        - { name: bounds_max,    type: "float[3]" }
    - record: view3d
      fields:
        - { name: view,        type: "float[16]" }  # 列主序
        - { name: proj,        type: "float[16]" }  # WebGPU NDC：z∈[0,1]
        - { name: eye,         type: "float[3]" }
        - { name: viewport,    type: "float[4]" }   # 目标像素 x,y,w,h
        - { name: exposure,    type: float }
        - { name: clear_mode,  type: int32_t }      # 0=skybox 1=color 2=depth 3=none
        - { name: clear_color, type: "float[4]" }
        - { name: layer_mask,  type: int32_t }
    - record: light
      fields:
        - { name: type,        type: int32_t }      # 0=directional 1=point 2=spot
        - { name: pos,         type: "float[3]" }
        - { name: dir,         type: "float[3]" }
        - { name: color,       type: "float[3]" }
        - { name: intensity,   type: float }
        - { name: range,       type: float }
        - { name: inner_cos,   type: float }
        - { name: outer_cos,   type: float }
        - { name: flags,       type: int32_t }      # bit0 cast_shadow
        - { name: shadow_slot, type: int32_t }      # -1 = 不投影
    - record: pbr_material
      fields:
        - { name: base_color,         type: "float[4]" }  # 线性空间
        - { name: emissive,           type: "float[3]" }
        - { name: metallic,           type: float }
        - { name: roughness,          type: float }
        - { name: normal_scale,       type: float }
        - { name: occlusion_strength, type: float }
        - { name: alpha_cutoff,       type: float }
        - { name: alpha_mode,         type: int32_t }     # 0=opaque 1=mask 2=blend
        - { name: flags,              type: int32_t }     # bit0 double_sided
        - { name: textures,           type: "int32_t[5]" } # base_color/mr/normal/occlusion/emissive
        - { name: uv_scale,           type: "float[2]" }
        - { name: uv_offset,          type: "float[2]" }
        - { name: clearcoat,           type: float }     # KHR_materials_clearcoat factor
        - { name: clearcoat_roughness, type: float }
        # ---- 多着色模型扩展（plans/19-threejs-materials.md；尾部追加，旧字段偏移不变）----
        - { name: shading_model,            type: int32_t }   # 0=Standard 1=Physical 2=Basic 3=Lambert 4=Phong
                                                             # 5=Toon 6=Normal 7=Matcap 8=Depth 9=Shadow
        - { name: side,                     type: int32_t }   # 0=Front 1=Back 2=Double
        - { name: flags2,                   type: int32_t }   # bit0 flat_shading / bit1 has_matcap / bit2 has_gradient / bit3 has_clearcoat_normal
        - { name: opacity,                  type: float }
        - { name: emissive_intensity,       type: float }
        - { name: env_intensity,            type: float }
        - { name: normal_scale_y,           type: float }
        - { name: specular,                 type: "float[3]" }
        - { name: shininess,                type: float }
        - { name: specular_intensity,       type: float }
        - { name: ior,                      type: float }
        - { name: sheen,                    type: float }
        - { name: sheen_roughness,          type: float }
        - { name: sheen_color,              type: "float[3]" }
        - { name: iridescence,              type: float }
        - { name: iridescence_ior,          type: float }
        - { name: iridescence_thickness_min, type: float }
        - { name: iridescence_thickness_max, type: float }
        - { name: anisotropy,               type: float }
        - { name: anisotropy_rotation,      type: float }
        - { name: clearcoat_normal_scale,   type: float }
        - { name: toon_steps,               type: int32_t }
        - { name: depth_packing,            type: int32_t }
        - { name: textures2,                type: "int32_t[3]" } # matcap / gradient / clearcoat_normal（-1=无）
        # KHR_texture_transform（plans/19）：法线贴图单独一组 UV 变换（其余贴图复用旧 uv_scale/uv_offset）
        - { name: normal_uv_scale,          type: "float[2]" }
        - { name: normal_uv_offset,         type: "float[2]" }
        # TEXCOORD_1（多 UV 集）选择掩码：bit0..7 = base/mr/ao/normal/emissive/matcap/gradient/
        # clearcoat_normal 使用第二套 UV（runtime 折进 flags2 bit4..11）。
        - { name: uv1_mask,                 type: int32_t }
        # KHR 扩展材质贴图槽（尾部追加）：clearcoat / clearcoat_roughness / sheen_color /
        # sheen_roughness / iridescence / iridescence_thickness / anisotropy（-1=无）。
        # 存在时 runtime 置 flags2 bit12..18；gfx 在 group1 binding 10..16 绑定。
        - { name: textures3,                type: "int32_t[7]" }
        # KHR_texture_transform.rotation（弧度）：基础贴图组 / 法线贴图组各一个旋转角。
        # gfx pack 到 Draw 的 specular.w / sheen_color.w（GPU 端不额外扩 uniform 结构）。
        - { name: uv_rotation,              type: float }
        - { name: normal_uv_rotation,       type: float }
        # KHR_materials_specular 两槽（尾部追加）：specular_texture.A = specularFactor、
        # specular_color_texture.RGB（sRGB）= specularColorFactor；-1=无。
        # 存在时 runtime 置 flags2 bit21/22；gfx 在 group1 binding 17/18 绑定。
        - { name: textures4,                type: "int32_t[2]" }
        # 折射/透射（尾部追加）：transmission 贴图槽（-1=无，flags2 bit23 presence）；
        # volume_thickness/dispersion 供 shader 的折射/色散近似。
        - { name: volume_thickness, type: float }
        - { name: dispersion,       type: float }
        - { name: textures5,        type: "int32_t[1]" }
        # KHR_materials_diffuse_transmission（尾部追加）：0..1 背光透射强度（flags2 bit24；
        # 不透明材质，shader 用 du[35] 做背光项，不再 alpha BLEND）。
        - { name: diffuse_transmission_factor, type: float }
        - { name: diffuse_transmission_color,  type: "float[3]" }
        # diffuseTransmissionTexture(A) / diffuseTransmissionColorTexture(RGB,sRGB)（-1=无；
        # flags2 bit25/26 presence；gfx 在 group1 binding 20/21 绑定）。
        - { name: textures6,                   type: "int32_t[2]" }
        # KHR_materials_volume（第 24 轮）：Beer-Lambert 吸收（attenuation_color/dist）、volume_scatter
        # 的 multiscatter_color、thicknessTexture（-1=无，flags2 bit27；group1 binding 22）。
        - { name: attenuation_color,    type: "float[3]" }
        - { name: attenuation_distance, type: float }
        - { name: multiscatter_color,   type: "float[3]" }
        - { name: textures7,            type: "int32_t[1]" }
    - record: draw3d
      fields:
        - { name: mesh,          type: int32_t }
        - { name: material,      type: int32_t }       # frame3d.materials 下标
        - { name: model,         type: "float[16]" }
        - { name: submesh_first, type: int32_t }
        - { name: submesh_count, type: int32_t }
        - { name: flags,         type: int32_t }       # cast/receive shadow 等
        - { name: layer,         type: int32_t }
        - { name: sort_key,      type: uint64_t }
        # 骨骼蒙皮（plans/22，第 28 轮）：frame3d.skins 下标；-1 = 非蒙皮（旧调用方零行为变化）。
        - { name: skin,          type: int32_t }
    # 骨骼调色板（plans/22）：joint_count × 16 列主序 mat4；palette[j] = world(joint_j) × inverse_bind_j。
    # 每帧由 runtime 生成，frame3d.skins[draw.skin] 引用；非蒙皮 draw 绑 1×mat4 单位 dummy。
    - record: skin
      fields:
        - { name: palette,     type: "const float*" }
        - { name: joint_count, type: uint32_t }
    - record: environment
      fields:
        - { name: sky_mode,    type: int32_t }      # 0=color 1=gradient 2=cubemap（第 26 轮）3=equirect
        - { name: sky_color,   type: "float[4]" }
        - { name: sky_texture, type: int32_t }
        - { name: env_color,   type: "float[4]" }
        - { name: env_texture, type: int32_t }
        # 漫反射辐照度贴图（PMREM 卷积产物，equirect RGBA16F；-1=无 → shader 回退 analytic）
        - { name: env_irradiance_texture, type: int32_t }
        # 立方体环境贴图（第 26 轮，kind=1 cube 句柄）：env_cubemap = GGX 预过滤 mip 链、
        # env_cubemap_irradiance = 余弦卷积 irradiance cube（16×16×6）；-1=无。非 -1 时 shader/天空走 cube 路径。
        - { name: env_cubemap, type: int32_t }
        - { name: env_cubemap_irradiance, type: int32_t }
        - { name: intensity,   type: float }
        # plans/19：analytic studio IBL（天空/地面渐变 + 软光箱高光；env_rotation 弧度，runtime 从场景度转换）
        - { name: env_sky_color,    type: "float[4]" }
        - { name: env_ground_color, type: "float[4]" }
        - { name: env_highlight,    type: float }
        - { name: env_rotation,     type: float }
    - record: post
      fields:
        - { name: exposure, type: float }
        - { name: tonemap,  type: int32_t }         # 0=none 1=ACES
    # 场景自带的全屏 shader pass（**场景资源**，不是 assets/builtin/shaders 内建 shader）：
    # shader = create_shader_pass 返回的句柄（-1 = 无）。引擎提供全屏三角形 VS，
    # 资源只提供 @fragment fs_main；uniform = group0 binding0 的 32B 结构（见 docs/13）。
    - record: shader_pass
      fields:
        - { name: shader, type: int32_t }
        - { name: time,   type: float }             # 组件 time（秒）
        - { name: frame,  type: float }             # 帧号
        - { name: mouse,  type: "float[4]" }        # xy = 目标像素（原点左上，与 frag_coord 同向）；zw 预留
    # 一帧 3D + 2D 覆盖层：非空 out = 离屏渲染并回读；空 out = 直接呈现到窗口。
    - record: frame3d
      fields:
        - { name: width,          type: int32_t }
        - { name: height,         type: int32_t }
        - { name: views,          type: "const mq_renderer_view3d*" }
        - { name: view_count,     type: uint32_t }
        - { name: lights,         type: "const mq_renderer_light*" }
        - { name: light_count,    type: uint32_t }
        - { name: materials,      type: "const mq_renderer_pbr_material*" }
        - { name: material_count, type: uint32_t }
        - { name: draws,          type: "const mq_renderer_draw3d*" }
        - { name: draw_count,     type: uint32_t }
        - { name: env,            type: mq_renderer_environment }
        - { name: post,           type: mq_renderer_post }
        - { name: items,          type: "const mq_renderer_item*" }
        - { name: item_count,     type: uint32_t }
        - { name: meshes,         type: "const mq_renderer_mesh*" }
        - { name: mesh_count,     type: uint32_t }
        # 2D 覆盖层视图（与旧 render_views 的 view 语义相同：多视图/相机）；空 = 默认单视图。
        - { name: views2d,        type: "const mq_renderer_view*" }
        - { name: view2d_count,   type: uint32_t }
        - { name: bg,             type: "float[4]" }      # 2D 覆盖层清屏色
        # MSAA 样本数：1=关（默认，保持旧输出逐字节不变）、4=4x（颜色/深度各一张 4x 附件，
        # pass 结束 resolve 到目标纹理）。runtime 从 scn.Scene.msaa_samples / MAQUE_MSAA 取值。
        - { name: msaa_samples,   type: int32_t }
        - { name: out,            type: "uint8_t*" }
        - { name: out_size,       type: uint32_t }
        # 场景资源全屏 shader pass（尾部追加；先于 3D/2D 绘制 = 背景层）。
        # 空/0 = 无。仅有 pass、没有 3D 组件（view_count=0）时也走 frame3d 通路。
        - { name: passes,         type: "const mq_renderer_shader_pass*" }
        - { name: pass_count,     type: uint32_t }
        # 骨骼蒙皮调色板（plans/22；尾部追加）。空/0 = 本帧无蒙皮 draw。
        - { name: skins,          type: "const mq_renderer_skin*" }
        - { name: skin_count,     type: uint32_t }
        # 直呈目标矩形（窗口设备像素）：0 宽/高 = 使用整个 surface。离屏 out 非空时忽略。
        - { name: present_x,      type: int32_t }
        - { name: present_y,      type: int32_t }
        - { name: present_w,      type: int32_t }
        - { name: present_h,      type: int32_t }
        # F4 调试渲染模式（尾部追加）：0=rendered（默认，完整材质）/ 1=solid / 2=wireframe。
        - { name: render_mode,    type: int32_t }
  methods:
    - fn: create
      returns: self
      args: [ { name: out_backend, type: "const char**" } ]
    - fn: destroy
      args: [ { name: self, type: self } ]
    - fn: destroy_texture
      returns: void
      args: [ { name: self, type: "self" }, { name: id, type: "int32_t" } ]
      doc: "释放纹理（字形图集增长后替换旧纹理用；id 无效则忽略）"
    - fn: create_texture
      returns: int32_t
      args: [ { name: self, type: self }, { name: rgba, type: "const uint8_t*" }, { name: w, type: int32_t }, { name: h, type: int32_t } ]
    - fn: has_texture
      returns: int32_t
      args: [ { name: self, type: self }, { name: id, type: int32_t } ]
    - fn: render_views
      returns: int32_t
      args: [ { name: self, type: self }, { name: tw, type: int32_t }, { name: th, type: int32_t }, { name: views, type: "const mq_renderer_view*" }, { name: nviews, type: uint32_t }, { name: items, type: "const mq_renderer_item*" }, { name: count, type: uint32_t }, { name: bg, type: "const float*" }, { name: out, type: "uint8_t*" }, { name: out_size, type: uint32_t } ]
    # 图元 + **网格**一次成帧（同一渲染目标，统一按 layer/z 排序 → 网格与精灵可正确互相遮挡）。
    # 这是 render_views 的超集；不带网格时等价于 render_views（兼容旧调用）。
    - fn: render_mesh_views
      returns: int32_t
      args: [ { name: self, type: self }, { name: tw, type: int32_t }, { name: th, type: int32_t }, { name: views, type: "const mq_renderer_view*" }, { name: nviews, type: uint32_t }, { name: items, type: "const mq_renderer_item*" }, { name: count, type: uint32_t }, { name: meshes, type: "const mq_renderer_mesh*" }, { name: mesh_count, type: uint32_t }, { name: bg, type: "const float*" }, { name: out, type: "uint8_t*" }, { name: out_size, type: uint32_t } ]
    # ---- 3D / 直接呈现（追加；plans/18-pbr-3d.md）----
    - fn: attach_window
      returns: int32_t
      args: [ { name: self, type: self }, { name: win, type: "const mq_renderer_window*" } ]
      doc: "建 wgpu surface + 交换链（直接呈现）；0=成功，非 0=不支持/无窗口（调用方回退离屏+platform 呈现）。可重复调用（resize/换显示器）"
    - fn: resize_surface
      returns: int32_t
      args: [ { name: self, type: self }, { name: w, type: int32_t }, { name: h, type: int32_t } ]
      doc: "重建交换链/深度/中间目标（设备像素尺寸）；下一帧生效"
    - fn: caps
      returns: int32_t
      args: [ { name: self, type: self }, { name: out, type: "mq_renderer_caps*" } ]
      doc: "适配器与目标格式能力（提取/资产 cook 据此选择；不做静默降级）"
    - fn: create_texture2
      returns: int32_t
      args: [ { name: self, type: self }, { name: desc, type: "const mq_renderer_texture_desc*" }, { name: out_id, type: "int32_t*" } ]
      doc: "带 sRGB/mip/wrap/filter 的纹理（PBR）；0=成功。旧 create_texture 仍是 2D 字形图集路径"
    - fn: create_mesh
      returns: int32_t
      args: [ { name: self, type: self }, { name: data, type: "const mq_renderer_mesh_gpu*" }, { name: out_id, type: "int32_t*" } ]
      doc: "上传 3D 网格（GPU 常驻；runtime 按资产缓存）；0=成功"
    - fn: destroy_mesh
      returns: void
      args: [ { name: self, type: self }, { name: id, type: "int32_t" } ]
    - fn: render_frame3d
      returns: int32_t
      args: [ { name: self, type: self }, { name: frame, type: "const mq_renderer_frame3d*" } ]
      doc: "一帧：阴影/3D PBR/天空/透明/tonemap + 2D 覆盖层；out 非空→离屏回读，空→直接呈现（需先 attach_window）"
    - fn: present
      returns: int32_t
      args: [ { name: self, type: self } ]
      doc: "提交交换链（直接呈现路径；离屏路径为空操作）"
    # ---- 场景资源全屏 shader（append-only）----
    - fn: create_shader_pass
      returns: int32_t
      args: [ { name: self, type: self }, { name: wgsl, type: "const char*" }, { name: out_id, type: "int32_t*" } ]
      doc: "编译场景提供的 WGSL 全屏 pass（需 @fragment fs_main + group0 binding0 的 32B uniform；引擎供全屏 VS）；0=成功"
    - fn: destroy_shader_pass
      returns: void
      args: [ { name: self, type: self }, { name: id, type: int32_t } ]
      doc: "释放 create_shader_pass 的句柄（场景重载/退出用；无效 id 忽略）"
    # ---- CPU morph 顶点更新（plans/22；append-only）----
    - fn: update_mesh
      returns: int32_t
      args: [ { name: self, type: self }, { name: id, type: int32_t }, { name: vertices, type: "const void*" }, { name: vertex_bytes, type: uint64_t } ]
      doc: "更新网格顶点（morph 变形；vertex_bytes 必须与创建时一致，stride/layout 不变）；0=成功"
    # ---- GPU 资源占用估算（append-only）----
    - fn: resource_bytes
      returns: uint64_t
      args: [ { name: self, type: self } ]
      doc: "当前存活纹理与网格顶点/索引缓冲的字节数估算；不含驱动对齐、render target 与每帧临时资源"
