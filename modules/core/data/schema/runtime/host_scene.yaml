    abi_name: "maque.host_scene"
    includes: [ "<stddef.h>", "<stdint.h>" ]
    opaque: [ mq_host_scene ]
    enums:
      - values:
          - { name: MQ_HOST_POINTER_DOWN, value: 0 }
          - { name: MQ_HOST_POINTER_UP, value: 1 }
          - { name: MQ_HOST_POINTER_MOVE, value: 2 }
          - { name: MQ_HOST_POINTER_WHEEL, value: 3 }
          - { name: MQ_HOST_POINTER_CANCEL, value: 4 }
