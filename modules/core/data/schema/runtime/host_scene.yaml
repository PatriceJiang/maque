      - { fn: mq_host_size, returns: "void", args: [ { name: s, type: "mq_host_scene*" }, { name: w, type: "int*" }, { name: h, type: "int*" } ] }
      - { fn: mq_host_push_pointer, returns: "void", args: [ { name: s, type: "mq_host_scene*" }, { name: type, type: "int" }, { name: button, type: "int" }, { name: x, type: "float" }, { name: y, type: "float" } ] }
      - { fn: mq_host_push_key, returns: "void", args: [ { name: s, type: "mq_host_scene*" }, { name: key, type: "int" }, { name: down, type: "int" }, { name: text, type: "const char*" } ] }
      - { fn: mq_host_frame, returns: "uint64_t", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_checksum, returns: "uint64_t", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_should_quit, returns: "int", args: [ { name: s, type: "mq_host_scene*" } ] }
      - { fn: mq_host_control, returns: "const char*", args: [ { name: s, type: "mq_host_scene*" }, { name: request, type: "const char*" } ] }
