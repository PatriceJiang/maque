      - name: mq_host_desc
        fields:
          - { name: struct_size, type: "uint32_t" }
          - { name: width, type: "int32_t" }
          - { name: height, type: "int32_t" }
          - { name: renderer, type: "const char*" }
          - { name: flags, type: "uint32_t" }
    fns:
      - { fn: mq_host_scene_create, returns: "mq_host_scene*", args: [ { name: scn_path, type: "const char*" }, { name: desc, type: "const mq_host_desc*" } ] }
