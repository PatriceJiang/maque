    # ---- ImGui（引擎侧即时模式调试/调参 UI，docs/27 §ImGui）----
    # 定位：**开发工具**，不是游戏 UI。游戏内 HUD 用声明式的 ui.*（它们进场景/快照/可回放）；
    # ImGui 面板是视图层：**不进快照、不进校验和**（docs/10 确定性不受影响）。
    # 生命周期（每帧）：
    #   1. 引擎在**脚本 update 之前** begin_frame（已转发输入）
    #   2. 脚本里 imgui_begin(...) … 控件 … imgui_end()
    #   3. 引擎在**所有引擎图层（含 ui pass）之后、present 之前** end_frame 并提交网格
    #      → 面板永远画在最上层，且**截图里也有**（可自证）
    # 输入隔离：ImGui 想要鼠标/键盘时，引擎**阻断世界输入**（不点穿到游戏）；
    #   脚本也可用 imgui_want_mouse()/imgui_hovered() 自行判断。
    # 约定：`imgui_begin` 返回 1 表示窗口可见（可见时才该调控件；**end 必须无条件调用**）。
    # 返回值类控件（slider/drag/input）**直接返回新值**，脚本无需处理指针（更贴合 JS/Lua）。
    - { fn: imgui_ready,        ctx: true, returns: float, doc: "ImGui 是否已初始化" }
    - { fn: imgui_enabled,      ctx: true, returns: float, doc: "面板是否启用（MAQUE_IMGUI=0 可关；默认关）" }
    - { fn: imgui_set_enabled,  ctx: true, args: [ { name: on, type: float } ], returns: float, doc: "运行时开关面板（关掉后不再占 GPU/输入）" }
    - { fn: imgui_begin,        ctx: true, args: [ { name: title, type: string } ], returns: float, doc: "开窗口 → 1=可见（须配对 imgui_end）" }
    - { fn: imgui_end,          ctx: true }
    - { fn: imgui_begin_closed, ctx: true, args: [ { name: title, type: string }, { name: x, type: float }, { name: y, type: float }, { name: w, type: float }, { name: h, type: float } ], returns: float, doc: "指定位置/尺寸且默认打开" }
    - { fn: imgui_set_pos,      ctx: true, args: [ { name: x, type: float }, { name: y, type: float } ] }
    - { fn: imgui_set_size,     ctx: true, args: [ { name: w, type: float }, { name: h, type: float } ] }
    - { fn: imgui_same_line,    ctx: true }
    - { fn: imgui_separator,    ctx: true }
