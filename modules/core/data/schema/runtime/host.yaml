# host —— 脚本全局 API · modules/runtime
# 宿主 API（引擎能力）：ctx:true → 生成 C 声明 + JS 绑定（docs/21）
- namespace: host
  version: 1
  global: true          # host.* 绑定到脚本全局（log(...)）
  api_list:
    - { fn: screen_w,      returns: float,  ctx: true }
    - { fn: screen_h,      returns: float,  ctx: true }
    - { fn: rng,           returns: float,  ctx: true }
    - { fn: quit,          returns: void,   ctx: true }
    - { fn: clear,         ctx: true, args: [ { name: r, type: float }, { name: g, type: float }, { name: b, type: float } ] }
    - { fn: log,           ctx: true, args: [ { name: msg,  type: string } ] }
    - { fn: cfg,           ctx: true, args: [ { name: path, type: string } ], returns: float }
    - { fn: load_texture,  ctx: true, args: [ { name: path, type: string } ], returns: float }
    - { fn: entity_spawn,  ctx: true, returns: float }
    - { fn: entity_set_pos,ctx: true, args: [ { name: id, type: float }, { name: x, type: float }, { name: y, type: float } ] }
    - { fn: entity_x,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_y,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_count,  ctx: true, returns: float }
    - { fn: entity_destroy,ctx: true, args: [ { name: id, type: float } ] }
    - { fn: entity_name,   ctx: true, args: [ { name: id, type: float } ], returns: string }
    # 运行期配置：读宿主环境变量（不存在 → ""）。
    # 用途：游戏资源（远程/热更内容）不该被硬编码；CI 与调试也需要"给资源一个开关"。
    - { fn: env,           ctx: true, args: [ { name: name, type: string } ], returns: string }
    - { fn: entity_find,   ctx: true, args: [ { name: name, type: string } ], returns: float }
    # 实体 id 单调分配（永不复用）→ 陈旧 id 可判定：valid=0 表示已销毁/从未存在
    - { fn: entity_valid,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 输入（docs/19）：脚本读"事件发生时"的状态，不读设备（确定性/回放友好）
    - { fn: input_x,       ctx: true, returns: float }
    - { fn: input_y,       ctx: true, returns: float }
    - { fn: input_target,  ctx: true, returns: float }     # 命中实体（-1 = 未命中）
    - { fn: input_down,    ctx: true, returns: float }     # 左键/指针是否按住
    - { fn: input_key,     ctx: true, args: [ { name: code, type: float } ], returns: float }
    - { fn: input_focus,   ctx: true, returns: float }
    - { fn: input_set_focus, ctx: true, args: [ { name: id, type: float } ] }
    # UI（docs/19 §4/§8、components/04）：命中/悬停查询（引擎按 role，不认具体组件）
    - { fn: ui_hit,        ctx: true, returns: float }     # 当前指针下最上层可交互控件
    - { fn: ui_hover,      ctx: true, returns: float }     # 上一帧悬停控件
    - { fn: ui_pressed,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_z,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: entity_set_z,  ctx: true, args: [ { name: id, type: float }, { name: z, type: float } ] }
    # 游戏常用组合（保持脚本只表达玩法；物理语义在引擎侧，docs/15/19）
    - { fn: spawn_ball,    ctx: true, args: [ { name: x, type: float }, { name: y, type: float },
                                             { name: vx, type: float }, { name: vy, type: float },
                                             { name: radius, type: float } ], returns: float }
    - { fn: bounce_step,   ctx: true, args: [ { name: dt, type: float } ] }   # 兼容旧脚本（自 M6 起为 no-op）
    - { fn: physics_step,  ctx: true }                                       # 固定步长物理推进（docs/15 §3）
    # 碰撞查询（docs/15 §3、docs/19）：**本帧**求解器算出的接触对，供脚本做玩法判定
    #（撞管死亡 / 穿越得分 / 机关触发）。语义刻意保持"查询"而非"回调"：引擎不硬编码
    # 任何碰撞回调，玩法仍在脚本层；顺序按 (a_index,b_index) 升序 → 确定性（docs/10 D4）。
    # 配对的接触返回 true，撞世界边界（平面）的接触返回 false。
    - { fn: physics_contact_count,    ctx: true, returns: float }
    - { fn: physics_contact_pair,     ctx: true, args: [ { name: i, type: float } ], returns: bool }
    - { fn: physics_contact_a,        ctx: true, args: [ { name: i, type: float } ], returns: float }
    - { fn: physics_contact_b,        ctx: true, args: [ { name: i, type: float } ], returns: float }
    - { fn: physics_contact_normal_x, ctx: true, args: [ { name: i, type: float } ], returns: float }
    - { fn: physics_contact_normal_y, ctx: true, args: [ { name: i, type: float } ], returns: float }
    - { fn: ball_clear,    ctx: true }
    # 组件字段（脚本改文本等；引擎按 role 定位组件，不认具体类型名）
    - { fn: set_label,     ctx: true, args: [ { name: id, type: float }, { name: text, type: string } ] }
    - { fn: ui_hit_at,     ctx: true, args: [ { name: x, type: float }, { name: y, type: float } ], returns: float }
    # 导航（确定性 2D 网格 A*）：建网格 / 设障碍 / 指定目标 / 查询路径长度
    - { fn: nav_setup,     ctx: true, args: [ { name: cols, type: float }, { name: rows, type: float },
                                             { name: cell, type: float } ] }
    - { fn: nav_block,     ctx: true, args: [ { name: cx, type: float }, { name: cy, type: float },
                                             { name: w, type: float }, { name: h, type: float } ] }
    - { fn: nav_goto,      ctx: true, args: [ { name: id, type: float }, { name: x, type: float },
                                             { name: y, type: float } ], returns: float }
    - { fn: nav_path_len,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: nav_tick,      ctx: true }

    # ---- 节点/组件 API（节点 / 组件 / Director 三件套）----
    # 层级（setParent / parent / children / getChildByName）
    - { fn: node_set_parent,     ctx: true, args: [ { name: id, type: float }, { name: parent, type: float } ], returns: float }
    - { fn: node_parent,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_child_count,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_child_at,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float }
    - { fn: node_find_child,     ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float }
    - { fn: node_set_name,       ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ] }
    # 节点属性（active / scale / angle / opacity / zIndex / contentSize / anchor）
    - { fn: node_set_active,     ctx: true, args: [ { name: id, type: float }, { name: on, type: float } ] }
    - { fn: node_active,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_scale,      ctx: true, args: [ { name: id, type: float }, { name: s, type: float } ] }
    - { fn: node_scale,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_angle,      ctx: true, args: [ { name: id, type: float }, { name: deg, type: float } ] }
    - { fn: node_angle,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_opacity,    ctx: true, args: [ { name: id, type: float }, { name: a, type: float } ] }
    - { fn: node_opacity,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_z_index,    ctx: true, args: [ { name: id, type: float }, { name: z, type: float } ] }
    - { fn: node_z_index,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_width,          ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_height,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_position,   ctx: true, args: [ { name: id, type: float }, { name: x, type: float }, { name: y, type: float } ] }
    - { fn: node_position_x,     ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_position_y,     ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_set_content_size, ctx: true, args: [ { name: id, type: float }, { name: w, type: float }, { name: h, type: float } ] }
    - { fn: node_set_anchor,     ctx: true, args: [ { name: id, type: float }, { name: ax, type: float }, { name: ay, type: float } ] }
    # 组件（getComponent / addComponent / getComponentInChildren 等价）
    - { fn: node_has_component,  ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_add_component,  ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_remove_component, ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    - { fn: node_component_count, ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_component_at,   ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: node_child_with_component, ctx: true, args: [ { name: id, type: float }, { name: type, type: string } ], returns: float }
    # 组件字段（反射读写：字段反射读写）
    - { fn: node_get_number,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: float }
    - { fn: node_set_number,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: float } ], returns: float }
    - { fn: node_get_bool,       ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: float }
    - { fn: node_set_bool,       ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: float } ], returns: float }
    - { fn: node_get_string,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string } ], returns: string }
    - { fn: node_set_string,     ctx: true, args: [ { name: id, type: float }, { name: comp, type: string }, { name: field, type: string }, { name: value, type: string } ], returns: float }
    # 事件（node.on / off / emit；emit 沿父链冒泡，沿父链冒泡）
    - { fn: node_on,             ctx: true, args: [ { name: id, type: float }, { name: event, type: string }, { name: handler, type: string } ], returns: float }
    - { fn: node_off,            ctx: true, args: [ { name: id, type: float }, { name: event, type: string } ], returns: float }
    - { fn: node_emit,           ctx: true, args: [ { name: id, type: float }, { name: event, type: string } ], returns: float }
    - { fn: node_emit_number,    ctx: true, args: [ { name: id, type: float }, { name: event, type: string }, { name: value, type: float } ], returns: float }
    # UI 控件值（按 role 统一读写：ProgressBar / Slider / CheckBox）
    - { fn: ui_set_value,        ctx: true, args: [ { name: id, type: float }, { name: v, type: float } ], returns: float }
    - { fn: ui_get_value,        ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_set_checked,      ctx: true, args: [ { name: id, type: float }, { name: on, type: float } ], returns: float }
    - { fn: ui_get_checked,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 画布 / 分辨率策略（docs/17）：设计分辨率 → 设备像素的适配结果
    - { fn: window_w,         ctx: true, args: [], returns: float, doc: "绘制区宽（设备像素；HiDPI 下大于 screen_w）" }
    - { fn: window_h,         ctx: true, args: [], returns: float }
    - { fn: canvas_scale,     ctx: true, args: [], returns: float, doc: "设计 → 设备 的等比缩放" }
    - { fn: canvas_scale_x,   ctx: true, args: [], returns: float }
    - { fn: canvas_scale_y,   ctx: true, args: [], returns: float }
    - { fn: canvas_offset_x,  ctx: true, args: [], returns: float, doc: "画布原点的绘制区偏移（留边）" }
    - { fn: canvas_offset_y,  ctx: true, args: [], returns: float }
    - { fn: canvas_device_scale, ctx: true, args: [], returns: float, doc: "显示器内容缩放（HiDPI）" }
    - { fn: canvas_safe_area, ctx: true, args: [ { name: edge, type: float } ], returns: float,
        doc: "安全区内缩（0=左 1=上 2=右 3=下，设备像素）" }
    # 文本（Label / TextLabel / RichText 通用：按 role 读写）
    - { fn: ui_set_text,    ctx: true, args: [ { name: id, type: float }, { name: text, type: string } ], returns: float }
    - { fn: ui_get_text,    ctx: true, args: [ { name: id, type: float } ], returns: string }
    - { fn: ui_text_width,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_text_height, ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: ui_text_lines,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    # Director（暂停/恢复/帧号/切场景；切场景在帧边界生效）
    - { fn: director_pause,      ctx: true }
    - { fn: director_resume,     ctx: true }
    - { fn: director_paused,     ctx: true, returns: float }
    - { fn: director_frame,      ctx: true, returns: float }
    - { fn: director_load_scene, ctx: true, args: [ { name: path, type: string } ], returns: float }

    # ---- 常用 API 续：Tween / schedule / destroy / find(path) ----
    # Tween（确定性：固定步长推进，完成时派发 tween_complete）
    - { fn: tween_start,   ctx: true, args: [ { name: id, type: float }, { name: field, type: string },
                                             { name: to, type: float }, { name: duration, type: float },
                                             { name: easing, type: float } ], returns: float }
    - { fn: tween_stop,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: tween_count,   ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: tween_progress, ctx: true, args: [ { name: id, type: float } ], returns: float }
    # 定时器（帧驱动，确定性；delay/interval 以秒计）
    - { fn: schedule_once, ctx: true, args: [ { name: handler, type: string }, { name: delay, type: float } ], returns: float }
    - { fn: schedule,      ctx: true, args: [ { name: handler, type: string }, { name: interval, type: float } ], returns: float }
    - { fn: unschedule,    ctx: true, args: [ { name: handler, type: string } ], returns: float }
    - { fn: schedule_count, ctx: true, returns: float }
    # 节点销毁（延迟到帧边界，帧末生效）+ 路径查找 find("Canvas/Panel")
    - { fn: node_destroy,  ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_valid,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: node_find_path, ctx: true, args: [ { name: root, type: float }, { name: path, type: string } ], returns: float }

    # ---- Spine 2D（docs/27、docs/assets/06 §2）：按实体 id 寻址的骨骼动画查询/控制 ----
    # 说明：动画名是**稳定路径**（骨架内声明序）；下标 i 是骨架内的声明序（docs/10 D4）。
    # 越界/无实例一律返回 0 / "" / -1，且不崩（脚本侧无需防御）。
    - { fn: spine_animation_count,  ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "动画个数（无 SpineSkeleton 组件 → 0）" }
    - { fn: spine_animation_name,   ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string,
        doc: "第 index 个动画名（声明序；越界 → \"\"）" }
    - { fn: spine_animation_index,  ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "动画名 → 声明序下标（不存在 → -1）" }
    - { fn: spine_play,             ctx: true, args: [ { name: id, type: float }, { name: name, type: string }, { name: loop, type: float } ], returns: float,
        doc: "播放动画（loop != 0 循环）；成功 0，失败 -1（名字不存在/无实例）" }
    - { fn: spine_current_animation, ctx: true, args: [ { name: id, type: float } ], returns: string,
        doc: "track 0 当前动画名（未播放 → \"\"）" }
    - { fn: spine_set_skin,         ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "换皮肤（名字不存在 → -1）" }
    - { fn: spine_skin_count,       ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_skin_name,        ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_time,             ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "track 0 播放头时间（秒）" }
    - { fn: spine_set_time,         ctx: true, args: [ { name: id, type: float }, { name: t, type: float } ], returns: float,
        doc: "设置播放头时间（确定性回放/定格用；下一帧 step 生效）" }
    - { fn: spine_pages,            ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "图集页数（多页图集 = 多次绘制批次）" }
    - { fn: spine_page_texture,     ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float,
        doc: "第 index 页的引擎纹理句柄（-1 = 无/越界；用于确认纹理真的上传了）" }

    # ---- Spine 2D 续：多轨 / 混合 / 事件 / 皮肤合成 / 骨骼 / 槽区间 / 物理 / 序列帧 ----
    # 覆盖官方 11 个 demo 需要的能力（.deps/official/DEMO-SPEC.md）。
    # 事件投递＝两条路一起走：① 按事件名冒泡到 `node_on(id, "spine_complete", "handler")` 注册的处理函数
    # （与 docs/14 事件总线同一条路径，单线程、帧内同步，确定性不受影响）；
    # ② 事件记录可用 spine_event_count/…"pull"出来看细节。
    # 记录在**帧边界**（脚本 update 之前）清空 → "本帧 step 产生的事件，下一帧脚本能读到"。
    - { fn: spine_set_animation,    ctx: true, args: [ { name: id, type: float }, { name: track, type: float }, { name: name, type: string }, { name: loop, type: float } ], returns: float,
        doc: "指定轨播动画（IK: track0=walk、track1=aim）；成功 0，失败 -1" }
    - { fn: spine_add_animation,    ctx: true, args: [ { name: id, type: float }, { name: track, type: float }, { name: name, type: string }, { name: loop, type: float }, { name: delay, type: float } ], returns: float,
        doc: "排队：delay 秒后播（Raptor: track1 gun-grab false 2）" }
    - { fn: spine_track_count,      ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "有轨条目的轨数" }
    - { fn: spine_track_animation,  ctx: true, args: [ { name: id, type: float }, { name: track, type: float } ], returns: string,
        doc: "该轨当前动画名（空轨 → \"\"）" }
    - { fn: spine_queue_count,      ctx: true, args: [ { name: id, type: float }, { name: track, type: float } ], returns: float,
        doc: "该轨排队中的条目数（addAnimation 之后还剩几个；官方 SkeletonAnimation 的 queue 语义）" }
    - { fn: spine_clear_track,      ctx: true, args: [ { name: id, type: float }, { name: track, type: float } ], returns: float }
    - { fn: spine_track_time,       ctx: true, args: [ { name: id, type: float }, { name: track, type: float } ], returns: float,
        doc: "该轨播放头时间（秒）；多轨各自独立推进" }
    - { fn: spine_set_track_time,   ctx: true, args: [ { name: id, type: float }, { name: track, type: float }, { name: t, type: float } ], returns: float,
        doc: "设该轨播放头（设完立刻 step(0) 重算姿势）" }
    - { fn: spine_track_time_scale, ctx: true, args: [ { name: id, type: float }, { name: track, type: float } ], returns: float }
    - { fn: spine_set_track_time_scale, ctx: true, args: [ { name: id, type: float }, { name: track, type: float }, { name: scale, type: float } ], returns: float }
    - { fn: spine_time_scale,       ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "AnimationState 全局时间缩放（官方 Coin/Tank 的 setTimeScale(0.3)）" }
    - { fn: spine_set_time_scale,   ctx: true, args: [ { name: id, type: float }, { name: scale, type: float } ], returns: float }
    - { fn: spine_default_mix,      ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_set_default_mix,  ctx: true, args: [ { name: id, type: float }, { name: duration, type: float } ], returns: float,
        doc: "换动画的默认混合时长（官方 C++ 入口 demo: 0.2）" }
    - { fn: spine_set_mix,          ctx: true, args: [ { name: id, type: float }, { name: from, type: string }, { name: to, type: string }, { name: duration, type: float } ], returns: float,
        doc: "setMix(from,to,duration)（Batching walk→jump 0.2；Separator 0.4）" }
    - { fn: spine_event_count,      ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "上一次帧边界以来发生的事件数（Spineboy: start/complete/event…）" }
    - { fn: spine_event_type,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float,
        doc: "事件类型：0=start 1=interrupt 2=end 3=complete 4=dispose 5=event（越界 → -1）" }
    - { fn: spine_event_track,      ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float }
    - { fn: spine_event_animation,  ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_event_name,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string,
        doc: "用户事件名（仅 type=5；否则 \"\"）" }
    - { fn: spine_event_int,        ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float }
    - { fn: spine_event_float,      ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: float }
    - { fn: spine_event_string,     ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_clear_events,     ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_bone_count,       ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_bone_name,        ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_bone_find,        ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "骨骼名 → 序号（-1 = 无）" }
    - { fn: spine_bone_value,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float }, { name: what, type: float } ], returns: float,
        doc: "what: 0=局部x 1=局部y 2=世界x 3=世界y（世界坐标 = 骨架子空间、y 向上）" }
    - { fn: spine_bone_set_position, ctx: true, args: [ { name: id, type: float }, { name: index, type: float }, { name: x, type: float }, { name: y, type: float } ], returns: float,
        doc: "设父空间局部位置" }
    - { fn: spine_bone_set_world_position, ctx: true, args: [ { name: id, type: float }, { name: index, type: float }, { name: x, type: float }, { name: y, type: float } ], returns: float,
        doc: "设世界位置（内部走父骨骼 worldToLocal，与官方 IK demo 同款）" }
    - { fn: spine_update_world_transform, ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "只重算世界变换（不 apply 动画）→ 设完骨骼位置后让 IK 链当帧跟随" }
    - { fn: spine_slot_count,       ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_slot_name,        ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_slot_index,       ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "槽名 → 声明序下标（= 官方 findSlot(name)->getData().getIndex()；-1 = 无）" }
    - { fn: spine_slot_attachment,  ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string,
        doc: "该槽当前附件名（\"\" = 空槽）" }
    - { fn: spine_set_slots_range,  ctx: true, args: [ { name: id, type: float }, { name: from, type: float }, { name: to, type: float } ], returns: float,
        doc: "只画声明序槽区间 [from,to]（to<0 → 到末尾；from<0 → 不限制）—— Separator demo 的前/后段拆分" }
    - { fn: spine_slots_from,       ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_slots_to,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_set_attachment,   ctx: true, args: [ { name: id, type: float }, { name: slot_name, type: string }, { name: attachment_name, type: string }, { name: skin_name, type: string } ], returns: float,
        doc: "按皮肤名取附件设到槽（skin_name 空 → 当前皮肤；attachment_name 空 → 卸下）" }
    - { fn: spine_skin_find,        ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "皮肤名 → 声明序下标（-1 = 无）" }
    # 皮肤合成三步（官方 MixAndMatch 的 Skin::addSkin 路径）：
    #   h = spine_skin_create(id, "mix-and-match")
    #   spine_skin_add(id, h, "skin-base") … 逐个并入
    #   spine_set_skin_obj(id, h) → 设为当前皮肤
    - { fn: spine_skin_create,      ctx: true, args: [ { name: id, type: float }, { name: name, type: string } ], returns: float,
        doc: "新建空皮肤 → 返回**句柄**（>=0；失败 -1）。句柄由引擎持有，切场景/退出时释放" }
    - { fn: spine_skin_add,         ctx: true, args: [ { name: id, type: float }, { name: handle, type: float }, { name: source_skin, type: string } ], returns: float,
        doc: "把骨架里名为 source_skin 的皮肤**并入**句柄（Skin::addSkin；同槽同名后者覆盖）；成功 0" }
    - { fn: spine_set_skin_obj,     ctx: true, args: [ { name: id, type: float }, { name: handle, type: float } ], returns: float,
        doc: "把句柄指向的皮肤设为当前皮肤（Skin* 版 setSkin + 按 setup 姿势复位槽）" }
    - { fn: spine_skin_compose,     ctx: true, args: [ { name: id, type: float }, { name: names, type: string } ], returns: float,
        doc: "一步到位：逗号分隔皮肤名 → 合成新皮肤并设为当前（MixAndMatch: skin-base,nose/short,…）；成功 0" }
    - { fn: spine_skin_attachment_count, ctx: true, args: [ { name: id, type: float }, { name: handle, type: float } ], returns: float,
        doc: "皮肤附件数（handle<0 → 最近一次 create/compose 的那一个；用于断言合成真的合上了）" }
    - { fn: spine_set_two_color,    ctx: true, args: [ { name: id, type: float }, { name: on, type: float } ], returns: float,
        doc: "官方 setTwoColorTint 的忠实复刻：**本引擎网格恒定走两色着色路径**（暗色通道始终产出；素材无 dark 时是 (0,0,0,1) → 与关闭逐字节等价），故该开关不改变输出，只为让官方 demo 的调用点有落处（值照存进组件字段）" }
    - { fn: spine_ik_count,         ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_ik_name,          ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_set_ik_mix,       ctx: true, args: [ { name: id, type: float }, { name: index, type: float }, { name: mix, type: float } ], returns: float }
    - { fn: spine_physics_count,    ctx: true, args: [ { name: id, type: float } ], returns: float,
        doc: "物理约束个数（celestial-circus 有；普通骨架 0）" }
    - { fn: spine_physics_name,     ctx: true, args: [ { name: id, type: float }, { name: index, type: float } ], returns: string }
    - { fn: spine_physics_translate, ctx: true, args: [ { name: id, type: float }, { name: x, type: float }, { name: y, type: float } ], returns: float,
        doc: "给所有物理约束一个位移冲量（官方 Physics demo）" }
    - { fn: spine_physics_reset,    ctx: true, args: [ { name: id, type: float } ], returns: float }
    - { fn: spine_sequence_frames,  ctx: true, args: [ { name: id, type: float }, { name: slot, type: float } ], returns: float,
        doc: "序列帧附件的总帧数（0 = 该槽不是序列帧附件）" }
    - { fn: spine_sequence_index,   ctx: true, args: [ { name: id, type: float }, { name: slot, type: float } ], returns: float,
        doc: "当前帧下标（-1 = setup 帧）" }
    - { fn: spine_sequence_path,    ctx: true, args: [ { name: id, type: float }, { name: slot, type: float } ], returns: string,
        doc: "当前帧路径名（Sequence::getPath）" }
    - { fn: spine_sequence_value,   ctx: true, args: [ { name: id, type: float }, { name: slot, type: float }, { name: what, type: float } ], returns: float,
        doc: "what: 0=u 1=v 2=u2 3=v2 4=width 5=height 6=setup_index（逐帧不同 → 可断言真的换图了）" }
    - { fn: spine_set_sequence_index, ctx: true, args: [ { name: id, type: float }, { name: slot, type: float }, { name: frame, type: float } ], returns: float,
        doc: "手动定格序列帧下标（-1 = setup 帧）" }
