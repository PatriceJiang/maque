# platform —— modules/platform
- namespace: platform
  version: 1
  module_abi:
    module: platform
    abi_name: "maque.platform"
    includes: [ "<stdint.h>" ]
    opaque: [ mq_platform ]
    macros:
      - { name: MQ_PLATFORM_MOD_SHIFT, value: "(1u << 0)" }
      - { name: MQ_PLATFORM_MOD_CTRL, value: "(1u << 1)" }
      - { name: MQ_PLATFORM_MOD_ALT, value: "(1u << 2)" }
      - { name: MQ_PLATFORM_MOD_META, value: "(1u << 3)" }
    enums:
      - name: mq_platform_pointer_type
        values:
          - { name: MQ_PLATFORM_POINTER_MOUSE, value: 0 }
          - { name: MQ_PLATFORM_POINTER_TOUCH, value: 1 }
          - { name: MQ_PLATFORM_POINTER_PEN, value: 2 }
      - name: mq_platform_pointer_event_type
        values:
          - { name: MQ_PLATFORM_POINTER_DOWN, value: 0 }
          - { name: MQ_PLATFORM_POINTER_UP, value: 1 }
          - { name: MQ_PLATFORM_POINTER_MOVE, value: 2 }
          - { name: MQ_PLATFORM_POINTER_WHEEL, value: 3 }
          - { name: MQ_PLATFORM_POINTER_CANCEL, value: 4 }
      - values:
          - { name: MQ_KEY_UNKNOWN, value: 0 }
          - { name: MQ_KEY_ESCAPE, value: 1 }
          - { name: MQ_KEY_SPACE, value: 2 }
          - { name: MQ_KEY_ENTER, value: 3 }
          - { name: MQ_KEY_TAB, value: 4 }
          - { name: MQ_KEY_BACKSPACE, value: 5 }
          - { name: MQ_KEY_LEFT, value: 6 }
          - { name: MQ_KEY_RIGHT, value: 7 }
          - { name: MQ_KEY_UP, value: 8 }
          - { name: MQ_KEY_DOWN, value: 9 }
          - { name: MQ_KEY_TEXT, value: 10 }
          # 功能键 F1..F12：规范键空间里**没有** ASCII 对应（Windows VK_F1=0x70 会与 'p' 撞车），
          # 所以单独占 1001..1012。引擎自己用 F2 开关 ImGui 调试面板；
          # 其余留给游戏/脚本（`input_key(MQ_KEY_F1)` 之类）。
          - { name: MQ_KEY_F1,  value: 1001 }
          - { name: MQ_KEY_F2,  value: 1002 }
          - { name: MQ_KEY_F3,  value: 1003 }
          - { name: MQ_KEY_F4,  value: 1004 }
          - { name: MQ_KEY_F5,  value: 1005 }
          - { name: MQ_KEY_F6,  value: 1006 }
          - { name: MQ_KEY_F7,  value: 1007 }
          - { name: MQ_KEY_F8,  value: 1008 }
          - { name: MQ_KEY_F9,  value: 1009 }
          - { name: MQ_KEY_F10, value: 1010 }
          - { name: MQ_KEY_F11, value: 1011 }
          - { name: MQ_KEY_F12, value: 1012 }
          - { name: MQ_KEY_A, value: 32 }
    structs:
      - name: mq_platform_pointer_event
        fields:
          - { name: pointer_id, type: "uint32_t" }
          - { name: type, type: "uint32_t" }
          - { name: pointer_type, type: "uint32_t" }
          - { name: button, type: "uint32_t" }
          - { name: x, type: "float" }
          - { name: y, type: "float" }
          - { name: dx, type: "float" }
          - { name: dy, type: "float" }
          - { name: pressure, type: "float" }
          - { name: scroll_x, type: "float" }
          - { name: scroll_y, type: "float" }
          - { name: modifiers, type: "uint32_t" }
      - name: mq_platform_key_event
        fields:
          - { name: key, type: "uint32_t" }
          - { name: scancode, type: "uint32_t" }
          - { name: modifiers, type: "uint32_t" }
          - { name: repeat, type: "uint32_t" }
          - { name: down, type: "uint32_t" }
          - { name: text, type: "char[16]" }
      - name: mq_input_frame
        fields:
          - { name: quit, type: "int" }
          - { name: focused, type: "int" }
          - { name: mouse_x, type: "float" }
          - { name: mouse_y, type: "float" }
          - { name: mouse_down, type: "int" }
          - { name: pointers, type: "mq_platform_pointer_event*" }
          - { name: pointer_count, type: "uint32_t" }
          - { name: pointer_cap, type: "uint32_t" }
          - { name: keys, type: "mq_platform_key_event*" }
          - { name: key_count, type: "uint32_t" }
          - { name: key_cap, type: "uint32_t" }
          - { name: resized, type: "int" }
          - { name: width, type: "int" }
          - { name: height, type: "int" }
      # 原生窗口句柄（plans/18-pbr-3d.md §2.4）：renderer 用它建 wgpu surface 直接呈现。
      # kind: 0=none 1=win32 2=xlib 3=wayland；display/handle 含义随 kind。
      - name: mq_platform_native_window
        fields:
          - { name: kind, type: "int32_t" }
          - { name: display, type: "void*" }
          - { name: handle, type: "void*" }
          - { name: extra, type: "void*" }
    fns:
      - { fn: mq_platform_create, returns: "mq_platform*", args: [ { name: title, type: "const char*" }, { name: w, type: "int" }, { name: h, type: "int" } ] }
      - { fn: mq_platform_present, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: rgba, type: "const void*" },
                  { name: w, type: "int32_t" }, { name: h, type: "int32_t" } ],
          doc: "把 RGBA8 帧等比居中呈现到窗口（无窗口/off 安全空操作；MAQUE_PRESENT=off|software|accelerated）" }
      - { fn: mq_platform_drawable_size, returns: void,
          args: [ { name: p, type: "mq_platform*" }, { name: out_w, type: "int32_t*" }, { name: out_h, type: "int32_t*" } ],
          doc: "绘制区尺寸（设备像素；HiDPI 下大于窗口逻辑尺寸）" }
      # 窗口尺寸/最大化（宿主与 CI 控制）：用户拖拽标题栏、点最大化按钮走的是**同一条**
      # SDL 事件路径（SIZE_CHANGED → runtime 自动重建渲染目标）；这两个函数只是程序化入口。
      - { fn: mq_platform_window_size, returns: void,
          args: [ { name: p, type: "mq_platform*" }, { name: out_w, type: "int32_t*" }, { name: out_h, type: "int32_t*" } ],
          doc: "窗口**逻辑**尺寸（DPI 缩放后用户看到的尺寸；无窗口 → 0）——渲染倍率按它跟随窗口" }
      - { fn: mq_platform_set_window_size, returns: int32_t,
          args: [ { name: p, type: "mq_platform*" }, { name: w, type: "int32_t" }, { name: h, type: "int32_t" } ],
          doc: "设置窗口逻辑尺寸（像素）；0=成功，无窗口/非法尺寸非 0。触发真实 resize 事件 → 渲染目标按新尺寸重建（FBO 重建）" }
      - { fn: mq_platform_set_window_maximized, returns: int32_t,
          args: [ { name: p, type: "mq_platform*" }, { name: on, type: "int32_t" } ],
          doc: "最大化 / 还原窗口（on=0 还原）；0=成功，无窗口非 0。窗口必须可 resize（默认已是 SDL_WINDOW_RESIZABLE）" }
      - { fn: mq_platform_content_scale, returns: float,
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "显示器内容缩放（绘制区/窗口；1.0 = 非 HiDPI）" }
      - { fn: mq_platform_screen_size, returns: void,
          args: [ { name: p, type: "mq_platform*" }, { name: out_w, type: "int32_t*" }, { name: out_h, type: "int32_t*" } ],
          doc: "应用可见的桌面**逻辑**尺寸（已含 OS DPI 缩放；无窗口/无显示 → 0）——ImGui 调试面板按它算一次性的固定 UI 缩放" }
      - { fn: mq_platform_display_changed, returns: int,
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "自上次调用以来窗口是否更换显示器/尺寸变化（画布需重解析）" }
      # 暴露原生 SDL 句柄：官方 ImGui 后端（imgui_impl_sdl2 / imgui_impl_sdlrenderer2）
      # 需要真实的 SDL_Window*/SDL_Renderer*，不能由 runtime 自己伪造。
      # 返回不透明指针；无窗口/未初始化 → NULL（调用方必须判空）。
      - { fn: mq_platform_sdl_window, returns: "void*",
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "原生 SDL_Window*（无窗口时 NULL）" }
      # 原生窗口句柄（直接呈现）：renderer 用它在 wgpu 侧建 surface（Win32 HWND / X11 Window / Wayland wl_surface）。
      # 返回 1=可用 0=无窗口/驱动不支持（调用方回退离屏 + platform 呈现）。
      - { fn: mq_platform_get_native_window, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: out, type: "mq_platform_native_window*" } ],
          doc: "取原生窗口句柄（kind/display/handle；plans/18 §2.4）；1=可用 0=不可用" }
      # 呈现统一走 **SDL_Renderer**（唯一通道）：游戏帧先画进 renderer 后台缓冲，
      # ImGui 官方后端在同一后台缓冲上再画一趟，最后单次 present。
      # 不再使用 SDL_GetWindowSurface —— SDL2 不允许同一窗口混用 window surface 与 renderer
      #（混用正是「ImGui 一开、游戏画面就不上屏」的根因）。
      - { fn: mq_platform_draw_rect, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: rgba, type: "const void*" },
                  { name: w, type: "int32_t" }, { name: h, type: "int32_t" },
                  { name: dx, type: "int32_t" }, { name: dy, type: "int32_t" },
                  { name: dw, type: "int32_t" }, { name: dh, type: "int32_t" }, { name: filter, type: "int32_t" } ],
          doc: "把引擎帧画进 SDL_Renderer 后台缓冲（**不 present**；filter 0=linear 1=nearest -1=自动）——给「游戏帧 → ImGui pass → 单次 present」两阶段呈现用" }
      - { fn: mq_platform_present_ui, returns: int,
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "提交 renderer 后台缓冲：抓帧（MAQUE_CAPTURE）→ 单次 SDL_RenderPresent（游戏帧与 ImGui 面板一起上屏）" }
      - { fn: mq_platform_capture_now, returns: int,
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "立即把 renderer 后台缓冲按 MAQUE_CAPTURE 写一帧 PPM（用于在面板绘制之后抓图验证）" }
      - { fn: mq_platform_ensure_renderer, returns: "void*",
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "立即创建并返回 SDL_Renderer*（供 ImGui 官方后端在首帧前初始化；无窗口/off 返回 NULL）" }
      - { fn: mq_platform_sdl_renderer, returns: "void*",
          args: [ { name: p, type: "mq_platform*" } ],
          doc: "原生 SDL_Renderer*（呈现通道；ensure_renderer 之后非空）" }
      - { fn: mq_platform_set_safe_area, returns: void,
          args: [ { name: p, type: "mq_platform*" }, { name: l, type: "float" }, { name: t, type: "float" },
                  { name: r, type: "float" }, { name: b, type: "float" } ],
          doc: "安全区内缩（设备像素，刘海/圆角）；画布解析时扣除" }
      - { fn: mq_platform_present_rect, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: rgba, type: "const void*" },
                  { name: w, type: "int32_t" }, { name: h, type: "int32_t" },
                  { name: dx, type: "int32_t" }, { name: dy, type: "int32_t" },
                  { name: dw, type: "int32_t" }, { name: dh, type: "int32_t" }, { name: filter, type: "int32_t" } ],
          doc: "把帧按**指定目标矩形**画进 renderer 并立即 present（单阶段便捷接口；画布策略决定缩放/留边；filter 0=linear 1=nearest -1=自动）" }
      - { fn: mq_platform_simulate_pointer, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: kind, type: "int32_t" },
                  { name: x, type: "float" }, { name: y, type: "float" }, { name: button, type: "int32_t" } ],
          doc: "测试/CI 用：把指针事件压入 SDL 事件队列（kind: 0=move 1=down 2=up）——覆盖 OS→SDL→引擎的真实翻译路径" }
      # ---- 进程/工具（docs/29 Tracy：F3 启动 profiler GUI；基础数据 CPU/内存）----
      - { fn: mq_platform_spawn_detached, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: exe, type: "const char*" }, { name: args, type: "const char*" } ],
          doc: "以**分离进程**启动外部程序（F3 启动 Tracy profiler GUI 等）；args 为命令行参数串（可空）。0=成功；进程起来后与引擎无生命周期绑定" }
      - { fn: mq_platform_process_stats, returns: int,
          args: [ { name: p, type: "mq_platform*" }, { name: out_cpu_percent, type: "double*" }, { name: out_mem_bytes, type: "uint64_t*" } ],
          doc: "当前进程自上次调用以来的 CPU 占用百分比（0..100×核数）与常驻内存字节数（Tracy 基础数据；任一输出指针可空）" }
      - { fn: mq_platform_destroy, returns: "void", args: [ { name: p, type: "mq_platform*" } ] }
      - { fn: mq_platform_has_window, returns: "int", args: [ { name: p, type: "mq_platform*" } ] }
      - { fn: mq_platform_pump, returns: "void", args: [ { name: p, type: "mq_platform*" } ] }
      - { fn: mq_platform_poll, returns: "uint32_t", args: [ { name: p, type: "mq_platform*" }, { name: out, type: "mq_input_frame*" } ] }
      - { fn: mq_platform_inject_pointer, returns: "void", args: [ { name: p, type: "mq_platform*" }, { name: ev, type: "const mq_platform_pointer_event*" } ] }
      - { fn: mq_platform_inject_key, returns: "void", args: [ { name: p, type: "mq_platform*" }, { name: ev, type: "const mq_platform_key_event*" } ] }
      - { fn: mq_platform_set_title, returns: "void", args: [ { name: p, type: "mq_platform*" }, { name: title, type: "const char*" } ] }
      - { fn: mq_platform_request_quit, returns: "void", args: [ { name: p, type: "mq_platform*" } ] }
